[build]
  publish = "."

[[redirects]]
  from = "/*"
  to = "/SportVision-Club-Plus.html"
  status = 200

# En-têtes de sécurité HTTP (2026-08-06). CSP construite à partir des domaines
# externes réellement appelés : Google Fonts et le projet Supabase (fetch
# REST/auth/functions/storage, y compris les images publiques du bucket,
# d'où l'ajout dans img-src). Les URLs de paiement Stripe (Checkout Session,
# portail de facturation) sont obtenues côté serveur via des edge functions
# Supabase puis ouvertes par navigation complète (window.location.href) : ce
# n'est pas une requête fetch/connect ni un script chargé côté client, donc
# aucun domaine Stripe n'est nécessaire dans cette CSP. Le site utilise des
# gestionnaires d'évènements inline (onclick=...) et des <script> inline,
# d'où 'unsafe-inline' sur script-src et style-src. Pas de HSTS ajouté
# volontairement (à activer seulement après confirmation que tous les
# sous-domaines sont bien en HTTPS).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://lulgezzpvrlbftbykzrc.supabase.co; connect-src 'self' https://lulgezzpvrlbftbykzrc.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'"
