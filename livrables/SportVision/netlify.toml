# En-têtes de sécurité HTTP (2026-08-06). CSP construite à partir des seuls
# domaines externes réellement appelés par ce site : Google Fonts (feuille de
# style + fichiers de police) et le projet Supabase (fetch vers
# /functions/v1/create-guest-request et /functions/v1/check-disponibilite
# depuis reserver.html et demande-de-devis.html). Le site utilise des
# gestionnaires d'évènements inline (onclick=...) et des <script> inline,
# d'où 'unsafe-inline' sur script-src et style-src : durcir davantage
# nécessiterait une refonte du HTML, hors périmètre ici.
# HSTS ajouté le 2026-08-07 : tout est servi par Netlify, donc HTTPS par
# défaut sur le domaine exact visité, sans risque. Volontairement SANS
# includeSubDomains (on ne connaît pas encore tous les sous-domaines
# éventuels du domaine définitif — mail, outils internes...) ni preload
# (engagement long à ne pas prendre à la légère) : uniquement max-age sur le
# domaine exact.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://lulgezzpvrlbftbykzrc.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'"
