[build]
  base = "livrables/SportVision-Connect/app-next"
  command = "npm run build"
  # "publish" vide se résout par défaut sur le même chemin que "base" (publishOrigin: default,
  # vu dans les logs de build du 09/08/2026), ce que le plugin Next.js refuse explicitement
  # ("Your publish directory cannot be the same as the base directory"). .next (sortie standard
  # de `next build`, sous-dossier de base) est la valeur attendue par le Next Runtime — ce n'est
  # pas ce qu'il sert réellement (il gère SSR/Server Components/Middleware lui-même), juste ce
  # qu'il faut déclarer pour satisfaire cette vérification.
  publish = ".next"

# Plugin déclaré explicitement : la détection automatique du Next Runtime par Netlify a échoué
# une première fois (site créé le 09/08/2026 avec "Runtime: Not set" dans Build settings — tout
# renvoyait 404, y compris /favicon.ico, signe qu'aucun adaptateur SSR n'était branché). Le
# déclarer ici force son activation quelle que soit la détection automatique.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Variables d'environnement à définir dans Netlify (Site settings → Environment variables),
# jamais ici :
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY

# Headers de sécurité navigateur — absents jusqu'ici (trouvé par l'audit pré-lancement du
# 21/08, seule la Vitrine les avait). Repris du même patron déjà validé sur
# livrables/SportVision/netlify.toml. Pas de fonts.googleapis.com ici : layout.tsx utilise
# next/font pour toutes ses polices, servies depuis le domaine propre au build (voir son propre
# commentaire) — inutile d'assouplir la CSP pour ça, contrairement à app-connect. Le paiement/
# abonnement Stripe est une redirection pleine page (window.location.href), jamais un iframe/
# script embarqué — pas besoin d'autoriser de domaine Stripe ici.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://lulgezzpvrlbftbykzrc.supabase.co; connect-src 'self' https://lulgezzpvrlbftbykzrc.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'"
