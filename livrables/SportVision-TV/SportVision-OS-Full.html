<title>SportVision OS</title>
<style>
:root{
  --bg:#080A0F;--s1:#181C25;--s2:#11141B;--s3:#1E2330;
  --b1:rgba(255,255,255,.07);--b2:rgba(255,255,255,.12);
  --acc:#366BFF;--acc2:#7C4DFF;--gr:linear-gradient(135deg,#366BFF,#7C4DFF);
  --ok:#2ECC8A;--wa:#F5A524;--er:#F0445E;
  --t1:#F0F2F7;--t2:#8891A8;--t3:#555E73;
  --sw:228px;--rc:16px;--rb:9px;--rp:999px;
  --ff:'Inter',system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ff);background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* SCREENS */
.scr{display:none;height:100vh}
.scr.on{display:flex}

/* ── LOGIN ──────────────────────────────── */
#s-login{align-items:center;justify-content:center;background:var(--bg)}
.lw{width:400px;display:flex;flex-direction:column;gap:28px}
.l-logo{display:flex;align-items:center;gap:12px}
.l-ico{width:36px;height:36px;background:var(--gr);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.l-name{font-size:18px;font-weight:700;color:var(--t1)}
.l-tag{font-size:11px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase}
.l-form{display:flex;flex-direction:column;gap:14px}
.l-form label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--t3);margin-bottom:5px;display:block}
.l-inp{width:100%;height:42px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--rb);padding:0 14px;color:var(--t1);font-size:13.5px;font-family:var(--ff);outline:none;transition:border-color .15s}
.l-inp:focus{border-color:rgba(54,107,255,.5)}
.l-inp::placeholder{color:var(--t3)}
.l-sep{display:flex;align-items:center;gap:12px;color:var(--t3);font-size:12px}
.l-sep::before,.l-sep::after{content:'';flex:1;height:1px;background:var(--b1)}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-btn{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--rb);cursor:pointer;font-family:var(--ff);color:var(--t2);font-size:12px;font-weight:500;transition:border-color .15s,color .15s,background .15s}
.demo-btn:hover{background:var(--s3);color:var(--t1);border-color:var(--b2)}
.demo-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── ONBOARDING ─────────────────────────── */
#s-onboard{align-items:center;justify-content:center;background:var(--bg)}
.obw{width:480px;display:flex;flex-direction:column;gap:32px}
.ob-steps{display:flex;align-items:center;gap:0}
.ob-step{flex:1;height:3px;background:var(--b1);border-radius:var(--rp);transition:background .3s}
.ob-step.done{background:var(--gr)}
.ob-step+.ob-step{margin-left:4px}
.ob-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rc);padding:32px;display:flex;flex-direction:column;gap:20px}
.ob-ico{width:52px;height:52px;border-radius:14px;background:var(--gr);display:flex;align-items:center;justify-content:center;font-size:22px}
.ob-title{font-size:20px;font-weight:700;color:var(--t1)}
.ob-sub{font-size:13.5px;color:var(--t2);line-height:1.6}
.ob-fields{display:flex;flex-direction:column;gap:12px}
.ob-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ob-actions{display:flex;justify-content:space-between;align-items:center;margin-top:4px}

/* ── ERROR ──────────────────────────────── */
#s-error{align-items:center;justify-content:center;background:var(--bg)}
.erw{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;max-width:380px}
.er-code{font-size:96px;font-weight:800;line-height:1;background:var(--gr);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.er-title{font-size:22px;font-weight:700;color:var(--t1)}
.er-sub{font-size:13.5px;color:var(--t2);line-height:1.6}

/* ── APP SHELL ──────────────────────────── */
#s-app{overflow:hidden}
.sb{width:var(--sw);min-width:var(--sw);height:100vh;background:var(--s2);border-right:1px solid var(--b1);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;flex-shrink:0;scrollbar-width:none}
.sb::-webkit-scrollbar{display:none}
.sb-top{padding:17px 15px 15px;border-bottom:1px solid var(--b1);flex-shrink:0}
.sb-logo{display:flex;align-items:center;gap:10px}
.sb-ico{width:30px;height:30px;background:var(--gr);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-txt{display:flex;flex-direction:column;line-height:1}
.sb-n{font-size:13px;font-weight:700;letter-spacing:-.01em}
.sb-s{font-size:9.5px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.nav{padding:10px 10px 4px;flex-shrink:0}
.nl{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);padding:0 7px;margin-bottom:4px;display:block}
.ni{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rb);cursor:pointer;color:var(--t2);font-size:13px;font-weight:500;transition:background .12s,color .12s;margin-bottom:1px;border:none;background:transparent;width:100%;text-align:left;font-family:var(--ff)}
.ni:hover{background:rgba(255,255,255,.05);color:var(--t1)}
.ni.on{background:rgba(54,107,255,.11);color:var(--acc)}
.ni-ic{width:16px;height:16px;opacity:.55;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ni.on .ni-ic,.ni:hover .ni-ic{opacity:1}
.ni-lb{flex:1}
.nb{font-size:10px;font-weight:700;padding:1px 7px;border-radius:var(--rp)}
.nb-b{background:rgba(54,107,255,.18);color:var(--acc)}
.nb-r{background:rgba(240,68,94,.15);color:var(--er)}
.nb-o{background:rgba(245,165,36,.15);color:var(--wa)}
.sb-div{height:1px;background:var(--b1);margin:7px 10px;flex-shrink:0}
.sb-foot{margin-top:auto;border-top:1px solid var(--b1);padding:11px 10px;flex-shrink:0}
.u-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--rb);cursor:pointer;transition:background .12s}
.u-row:hover{background:rgba(255,255,255,.05)}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.u-meta{flex:1;min-width:0}
.u-n{font-size:12px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-r{font-size:10px;color:var(--t3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.tb{height:55px;min-height:55px;background:var(--s2);border-bottom:1px solid var(--b1);display:flex;align-items:center;padding:0 22px;gap:12px;flex-shrink:0}
.tb h1{font-size:15px;font-weight:650;color:var(--t1);flex:1}
.tb span{font-size:11px;color:var(--t3)}
.tb-act{display:flex;align-items:center;gap:8px;margin-left:auto}
.ib{width:34px;height:34px;border-radius:var(--rb);background:var(--s1);border:1px solid var(--b1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2);transition:background .12s,color .12s;position:relative;flex-shrink:0}
.ib:hover{background:rgba(255,255,255,.07);color:var(--t1)}
.ndot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--er);border:1.5px solid var(--s2)}
.ct{flex:1;overflow-y:auto;padding:22px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent}
.ct::-webkit-scrollbar{width:5px}
.ct::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

/* ── SHARED COMPONENTS ──────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--rb);font-size:12.5px;font-weight:600;cursor:pointer;border:none;font-family:var(--ff);transition:opacity .12s,transform .1s;white-space:nowrap}
.btn:hover{opacity:.88}.btn:active{transform:scale(.97)}
.bp{background:var(--gr);color:#fff}
.bg2{background:transparent;color:var(--t2);border:1px solid var(--b1)}
.bg2:hover{color:var(--t1);background:rgba(255,255,255,.05)}
.bs{padding:5px 11px;font-size:11.5px}
.kpi-g{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.kpi{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rc);padding:17px 19px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--kl,var(--acc));opacity:.45}
.kpi-ey{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--t3);margin-bottom:9px}
.kpi-v{font-size:28px;font-weight:700;color:var(--t1);line-height:1;font-variant-numeric:tabular-nums;margin-bottom:9px}
.kpi-d{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--rp)}
.dup{background:rgba(46,204,138,.1);color:var(--ok)}
.ddn{background:rgba(240,68,94,.1);color:var(--er)}
.dnt{background:rgba(255,255,255,.06);color:var(--t2)}
.cd{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rc);overflow:hidden;display:flex;flex-direction:column;margin-bottom:13px}
.cd-h{display:flex;align-items:center;justify-content:space-between;padding:14px 19px;border-bottom:1px solid var(--b1)}
.cd-t{font-size:13px;font-weight:650;color:var(--t1)}
.cd-s{font-size:11px;color:var(--t3);margin-top:1px}
.cd-b{padding:15px 19px;flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px}
.g32{display:grid;grid-template-columns:1.5fr 1fr;gap:13px;margin-bottom:13px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{padding:9px 13px;text-align:left;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--t3);border-bottom:1px solid var(--b1);white-space:nowrap}
tbody tr{border-bottom:1px solid rgba(255,255,255,.035);cursor:pointer;transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody td{padding:11px 13px;color:var(--t2);vertical-align:middle}
.tp{color:var(--t1);font-weight:500}
.tm{font-variant-numeric:tabular-nums;font-family:'SF Mono',Consolas,monospace;font-size:11px;color:var(--t3)}
.bd{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--rp);font-size:10.5px;font-weight:600;white-space:nowrap}
.bd-d{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.bl{background:rgba(240,68,94,.12);color:var(--er)}.bl .bd-d{background:var(--er);animation:bdot 1.4s ease-in-out infinite}
.ba{background:rgba(46,204,138,.1);color:var(--ok)}.ba .bd-d{background:var(--ok)}
.bw{background:rgba(245,165,36,.1);color:var(--wa)}.bw .bd-d{background:var(--wa)}
.bn{background:rgba(255,255,255,.06);color:var(--t3)}.bn .bd-d{background:var(--t3)}
.bb{background:rgba(54,107,255,.1);color:var(--acc)}.bb .bd-d{background:var(--acc)}
@keyframes bdot{0%,100%{opacity:1}50%{opacity:.35}}
.rl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:var(--rp)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.sh-t{font-size:14px;font-weight:650;color:var(--t1)}
.al{display:flex;flex-direction:column}
.ai{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.035)}
.ai:last-child{border-bottom:none}
.ai-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ai-t{font-size:12.5px;color:var(--t2);line-height:1.4}
.ai-t strong{color:var(--t1);font-weight:600}
.ai-ts{font-size:10.5px;color:var(--t3);margin-top:2px}

/* ── KANBAN ─────────────────────────────── */
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;min-height:300px}
.kb::-webkit-scrollbar{height:4px}
.kb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.kb-col{min-width:210px;max-width:210px;background:var(--s2);border:1px solid var(--b1);border-radius:var(--rc);display:flex;flex-direction:column;gap:0}
.kb-head{padding:12px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between}
.kb-ht{font-size:11.5px;font-weight:650;color:var(--t1)}
.kb-cnt{font-size:10px;font-weight:700;background:rgba(255,255,255,.07);color:var(--t2);padding:1px 7px;border-radius:var(--rp)}
.kb-body{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.kb-card{background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:12px;cursor:pointer;transition:border-color .15s,transform .15s}
.kb-card:hover{border-color:rgba(54,107,255,.3);transform:translateY(-1px)}
.kb-ref{font-size:10px;font-weight:600;color:var(--t3);font-family:monospace;margin-bottom:5px}
.kb-cn{font-size:12.5px;font-weight:600;color:var(--t1);margin-bottom:3px}
.kb-ty{font-size:11px;color:var(--t2);margin-bottom:8px}
.kb-av{display:flex;align-items:center;gap:4px}
.av-xs{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0}

/* ── CALENDRIER ÉDITORIAL ─────────────────── */
.cal-g{display:grid;grid-template-columns:80px repeat(7,1fr);gap:0;border:1px solid var(--b1);border-radius:var(--rc);overflow:hidden;margin-bottom:13px}
.cal-cell{padding:9px 10px;border-right:1px solid var(--b1);border-bottom:1px solid var(--b1);min-height:50px}
.cal-cell:last-child{border-right:none}
.cal-day-head{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);text-align:center;padding:8px 4px;background:var(--s2);border-right:1px solid var(--b1);border-bottom:1px solid var(--b1)}
.cal-day-head.today{color:var(--acc)}
.cal-plat{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);display:flex;align-items:center;padding:9px 10px;background:var(--s2);border-right:1px solid var(--b1);border-bottom:1px solid var(--b1)}
.cal-post{background:var(--s3);border-radius:5px;padding:4px 7px;font-size:10.5px;color:var(--t1);margin:3px 0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-post.sched{border-left:2px solid var(--acc)}
.cal-post.pub{border-left:2px solid var(--ok);opacity:.65}

/* ── MODE JOUR J ───────────────────────── */
.jj-hero{background:var(--gr);border-radius:var(--rc);padding:24px;margin-bottom:13px;display:flex;align-items:center;justify-content:space-between}
.jj-info h2{font-size:20px;font-weight:700;color:#fff;margin-bottom:4px}
.jj-info p{font-size:13px;color:rgba(255,255,255,.7)}
.jj-badge{background:rgba(255,255,255,.2);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:var(--rp);margin-top:10px;display:inline-flex;align-items:center;gap:5px}
.jj-dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:bdot 1.2s ease-in-out infinite}
.jj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:13px}
.jj-tile{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rc);padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s}
.jj-tile:hover{border-color:rgba(54,107,255,.3)}
.jj-tile-ico{font-size:22px}
.jj-tile-t{font-size:13px;font-weight:650;color:var(--t1)}
.jj-tile-s{font-size:11px;color:var(--t3)}

/* ── PIPELINE ──────────────────────────── */
.pip{display:flex;gap:11px;overflow-x:auto;padding-bottom:8px}
.pip-col{min-width:200px;background:var(--s2);border:1px solid var(--b1);border-radius:var(--rc);display:flex;flex-direction:column}
.pip-h{padding:11px 13px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between}
.pip-ht{font-size:11.5px;font-weight:650;color:var(--t1)}
.pip-b{padding:9px;display:flex;flex-direction:column;gap:7px;flex:1}
.pip-card{background:var(--s1);border:1px solid var(--b1);border-radius:9px;padding:11px;cursor:pointer;transition:border-color .15s}
.pip-card:hover{border-color:rgba(54,107,255,.3)}
.pip-cn{font-size:12.5px;font-weight:600;color:var(--t1);margin-bottom:3px}
.pip-det{font-size:11px;color:var(--t2)}
.pip-val{font-size:11.5px;font-weight:700;color:var(--ok);margin-top:6px;font-variant-numeric:tabular-nums}

/* ── PROGRESS ──────────────────────────── */
.pg{height:4px;background:rgba(255,255,255,.07);border-radius:var(--rp);overflow:hidden;margin-top:6px}
.pg-f{height:100%;border-radius:var(--rp);background:var(--gr)}

/* ── FIN BARS ──────────────────────────── */
.fb{display:flex;align-items:flex-end;gap:6px;padding-top:8px}
.fb-c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end}
.fb-b{width:100%;border-radius:4px 4px 0 0;min-height:4px;cursor:pointer;transition:opacity .12s}
.fb-b:hover{opacity:.75}
.fb-l{font-size:9.5px;color:var(--t3);font-weight:500}
.fs{background:var(--s1);border:1px solid var(--b1);border-radius:12px;padding:15px 17px}
.fs-l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:7px}
.fs-v{font-size:21px;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}

/* ── TEAM LIST ─────────────────────────── */
.tl{display:flex;flex-direction:column}
.ti{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.035)}
.ti:last-child{border-bottom:none}
.ti-m{flex:1;min-width:0}
.ti-n{font-size:12.5px;font-weight:500;color:var(--t1)}
.ti-k{font-size:11px;color:var(--t3)}

/* ── RESPONSIVE ────────────────────────── */
@media(max-width:1100px){
  :root{--sw:55px}
  .sb-txt,.ni-lb,.nl,.nb,.u-meta{display:none}
  .ni{justify-content:center;padding:9px}
  .sb-foot{padding:8px}
  .u-row{justify-content:center}
  .kpi-g{grid-template-columns:repeat(2,1fr)}
  .g32{grid-template-columns:1fr}
}
@media(max-width:768px){
  :root{--sw:0px}
  .sb{display:none}
  .kpi-g{grid-template-columns:1fr 1fr}
  .ct{padding:14px}
}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<!-- LOGIN -->
<div id="s-login" class="scr on">
  <div class="lw">
    <div class="l-logo">
      <div class="l-ico"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.5l2 4h4l-3.2 2.8 1.2 4L8 10.2 4 12.3l1.2-4L2 5.5h4L8 1.5z" fill="white"/></svg></div>
      <div><div class="l-name">SportVision OS</div><div class="l-tag">Elkana Group · v2.1</div></div>
    </div>
    <div class="l-form">
      <div><label>Adresse email</label><input id="l-email" class="l-inp" type="email" placeholder="nom@sportvision.fr"></div>
      <div><label>Mot de passe</label><input id="l-pass" class="l-inp" type="password" placeholder="••••••••"></div>
      <div id="l-err" style="font-size:12px;color:var(--er);min-height:16px;text-align:center"></div>
      <button id="l-btn" class="btn bp" style="width:100%;justify-content:center;height:42px;font-size:14px" onclick="doLogin()">Se connecter</button>
    </div>

function stBadge(s){

}
function avStack(eq){
  return'<div style="display:flex;align-items:center">'+eq.map(i=>`<div class="av-xs" style="background:${AVC[i]||'#366BFF'};margin-right:-5px;border:2px solid var(--s1)">${i}</div>`).join('')+'</div>';
}
function finBars(id,h){
  const el=document.getElementById(id);if(!el)return;
  const mx=Math.max(...FD.map(d=>d.v));
  el.style.height=h+'px';
  FD.forEach(d=>{
    const pct=Math.round((d.v/mx)*(h-20));
    el.innerHTML+=`<div class="fb-c"><div class="fb-b" style="height:${pct}px;background:${d.c?'var(--gr)':'rgba(54,107,255,.2)'}"></div><div class="fb-l">${d.m}</div></div>`;
  });
}

const SB_URL='https://lulgezzpvrlbftbykzrc.supabase.co';
const SB_KEY='sb_publishable_N_S7DxALGutAd6KlQmpaTw_h7cHNaE4';

function svSave(token,refresh,uid,role){
  localStorage.setItem('sv_tok',token);
  localStorage.setItem('sv_ref',refresh);
  localStorage.setItem('sv_uid',uid);
  localStorage.setItem('sv_role',role);
}
function svClear(){
  ['sv_tok','sv_ref','sv_uid','sv_role','sv_prenom'].forEach(k=>localStorage.removeItem(k));
}

async function doLogin(){
  const email=(document.getElementById('l-email').value||'').trim();
  const pass=document.getElementById('l-pass').value||'';
  const errEl=document.getElementById('l-err');
  const btn=document.getElementById('l-btn');
  if(!email||!pass){errEl.textContent='Remplissez email et mot de passe.';return;}
  errEl.textContent='';btn.textContent='Connexion…';btn.disabled=true;
  try{
    const r1=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',
      headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pass})
    });
    const d1=await r1.json();
    if(!d1.access_token)throw new Error('Email ou mot de passe incorrect.');
    const r2=await fetch(SB_URL+'/rest/v1/profiles?id=eq.'+d1.user.id+'&select=role,prenom',{
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+d1.access_token}
    });
    const profs=await r2.json();
    if(!profs||!profs[0])throw new Error('Profil introuvable. Contactez l\'administrateur.');
    svSave(d1.access_token,d1.refresh_token,d1.user.id,profs[0].role);
    if(profs[0].prenom)localStorage.setItem('sv_prenom',profs[0].prenom);
    goApp(profs[0].role);
  }catch(e){
    errEl.textContent=e.message||'Erreur de connexion.';
    btn.textContent='Se connecter';btn.disabled=false;
  }
}

async function doLogout(){
  await fetch(SB_URL+'/auth/v1/logout',{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+(localStorage.getItem('sv_tok')||'')}
  }).catch(()=>{});
  svClear();
  goLogin();
}

async function checkSession(){
  const tok=localStorage.getItem('sv_tok');
  const role=localStorage.getItem('sv_role');
  if(!tok||!role)return;
  try{
    const r=await fetch(SB_URL+'/auth/v1/user',{
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+tok}
    });
    if(r.ok){goApp(role);return;}
    // Token expiré, on tente le refresh
    const ref=localStorage.getItem('sv_ref');
    if(!ref){svClear();return;}
    const r2=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',
      headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:ref})
    });
    const d=await r2.json();
    if(d.access_token){
      svSave(d.access_token,d.refresh_token,localStorage.getItem('sv_uid'),role);
      goApp(role);
    }else{svClear();}
  }catch(e){/* réseau HS, on reste sur login */}
}

// ── API HELPER ───────────────────────────
async function sbFetch(path,opts={}){
  const tok=localStorage.getItem('sv_tok')||'';
  const res=await fetch(SB_URL+'/rest/v1/'+path,{
    method:opts.method||'GET',
    headers:{
      'apikey':SB_KEY,
      'Authorization':'Bearer '+tok,
      'Content-Type':'application/json',
      ...(opts.method==='POST'||opts.method==='PATCH'?{'Prefer':'return=representation'}:{}),
      ...opts.headers
    },
    body:opts.body?JSON.stringify(opts.body):undefined
  });
  const txt=await res.text();
  return txt?JSON.parse(txt):null;
}

async function creerCollaborateur(){
  const err=document.getElementById('fi-err');
  const prenom=document.getElementById('fi-prenom').value.trim();
  const nom=document.getElementById('fi-nom').value.trim();
  const email=document.getElementById('fi-email').value.trim();
  const role=document.getElementById('fi-role').value;
  const pass=document.getElementById('fi-pass').value;
  if(!prenom||!nom||!email||!pass){err.textContent='Tous les champs sont obligatoires.';return;}
  if(pass.length<8){err.textContent='Le mot de passe doit faire au moins 8 caractères.';return;}
  err.textContent='Création du compte…';
  try{
    const r=await fetch(SB_URL+'/auth/v1/signup',{
      method:'POST',
      headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pass,data:{role,prenom,nom}})
    });
    const d=await r.json();
    if(d.error||d.error_description){err.textContent=d.error_description||d.error||'Erreur.';return;}
    if(!d.id&&!d.user?.id){err.textContent='Compte non créé. Vérifie que l\'email n\'est pas déjà utilisé.';return;}
    closeModal();
    loadCollaborateurs();
    updateNavBadges(S.role);
  }catch(e){err.textContent='Erreur réseau.';}
}

  'arrivée_sur_place':'Arrivée sur place','production_démarrée':'Production démarrée',

  'livrée':'bn','facturée':'bw','partiellement_payée':'bw'};

let _prestationsCache=[];
let _preFiltre='';
async function loadPrestations(){
  const el=document.getElementById('pre-real');
  if(!el)return;
  try{
    const data=await sbFetch('prestations?select=id,reference,statut,statut_financier,type_prestation,date_prestation,lieu,montant_ttc,clients(nom)&order=date_prestation.desc&limit=200');
    if(!data||data.length===0){el.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;padding:48px;gap:10px;color:var(--t3)"><div style="font-size:36px;opacity:.2">📋</div><div>Aucune prestation. Créez la première.</div></div>';return;}
    _prestationsCache=data;
    renderPreTable();
  }catch(e){el.innerHTML='<div style="padding:20px;color:var(--er)">Erreur de chargement.</div>';}
}

function renderPreTable(){
  const el=document.getElementById('pre-real');
  if(!el)return;
  const q=(_preFiltre||'').toLowerCase();
  const list=q?_prestationsCache.filter(p=>
    (p.reference||'').toLowerCase().includes(q)||
    (p.clients?.nom||'').toLowerCase().includes(q)||
    (SL[p.statut]||'').toLowerCase().includes(q)||
    (p.type_prestation||'').toLowerCase().includes(q)
  ):_prestationsCache;
  const SF_CLS={'payée':'ba','partiellement_payée':'bw','facturée':'bw','en_retard':'bl','non_facturée':'bn'};
  const SF_LBL={'payée':'Payée','partiellement_payée':'Part. payée','facturée':'Facturée','en_retard':'En retard','non_facturée':'—','en_préparation':'En prép.'};
  el.innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;padding:10px 0 12px">
      <input id="pre-search" type="text" class="l-inp" placeholder="Rechercher ref, client, statut…" value="${_preFiltre}" oninput="_preFiltre=this.value;renderPreTable()" style="height:34px;flex:1;max-width:320px">
      <select class="l-inp" style="height:34px;max-width:180px" onchange="_preFiltre=this.value;document.getElementById('pre-search').value=this.value;renderPreTable()">
        <option value="">Tous les statuts</option>
        <optgroup label="En cours">${['confirmée','planifiée','équipe_affectée','prête'].map(s=>`<option value="${s}">${SL[s]}</option>`).join('')}</optgroup>
        <optgroup label="Production">${['production_démarrée','production_terminée','montage_en_cours','prêt_validation'].map(s=>`<option value="${s}">${SL[s]}</option>`).join('')}</optgroup>
        <optgroup label="Livraison">${['prête_à_livrer','livrée','facturée','payée'].map(s=>`<option value="${s}">${SL[s]}</option>`).join('')}</optgroup>
        <optgroup label="Annulé">${['annulée','refusée','clôturée'].map(s=>`<option value="${s}">${SL[s]}</option>`).join('')}</optgroup>
      </select>
      <span style="font-size:11px;color:var(--t3);white-space:nowrap">${list.length} / ${_prestationsCache.length}</span>
    </div>
    ${list.length?'<div class="tw" style="overflow-x:auto"><table><thead><tr><th>Référence</th><th>Client</th><th>Type</th><th>Date</th><th>Montant</th><th>Statut</th><th>Facturation</th><th></th></tr></thead><tbody>'+
      list.map((p,i)=>{const ri=_prestationsCache.indexOf(p);return`<tr>
        <td class="tm">${p.reference||'—'}</td>
        <td class="tp">${p.clients?.nom||'—'}</td>
        <td>${p.type_prestation||'—'}</td>
        <td>${p.date_prestation?new Date(p.date_prestation).toLocaleDateString('fr-FR'):'—'}</td>
        <td class="tm">${p.montant_ttc?p.montant_ttc.toLocaleString('fr-FR')+' €':'—'}</td>
        <td><span class="bd ${SC[p.statut]||'bw'}"><span class="bd-d"></span>${SL[p.statut]||p.statut}</span></td>
        <td><span class="bd ${SF_CLS[p.statut_financier]||'bn'}" style="font-size:10px"><span class="bd-d"></span>${SF_LBL[p.statut_financier]||'—'}</span></td>
        <td><button onclick="modalDetailPrestation(${ri})" style="padding:4px 10px;font-size:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:var(--rp);color:var(--t2);cursor:pointer;white-space:nowrap">Ouvrir</button></td>
      </tr>`}).join('')+
    '</tbody></table></div>':'<div style="padding:32px;text-align:center;color:var(--t3);font-size:13px">Aucun résultat pour « '+q+' ».</div>'}`;
}

async function modifierPrestation(id){
  const err=document.getElementById('pd-err');
  err.textContent='Enregistrement…';
  try{
    const body={
      statut:document.getElementById('pd-statut').value,
      statut_financier:document.getElementById('pd-sfin').value,
      date_prestation:document.getElementById('pd-date').value||null,
      lieu:document.getElementById('pd-lieu').value||null,
      montant_ttc:document.getElementById('pd-ttc').value?Number(document.getElementById('pd-ttc').value):null,
      montant_ht:document.getElementById('pd-ht').value?Number(document.getElementById('pd-ht').value):null,
      notes_internes:document.getElementById('pd-notes').value||null,
    };
    await sbFetch('prestations?id=eq.'+id,{method:'PATCH',body});
    closeModal();
    if(document.getElementById('kanban-real')) loadKanban();
    else if(document.getElementById('planning-real')) loadPlanning();
    else if(document.getElementById('pre-real')) loadPrestations();
    updateNavBadges(S.role);
  }catch(e){err.textContent='Erreur lors de la modification.';}
}

async function supprimerPrestation(id){
  if(!confirm('Supprimer cette prestation ? Cette action est irréversible.'))return;
  try{
    await sbFetch('prestations?id=eq.'+id,{method:'DELETE'});
    closeModal();
    loadPrestations();
    updateNavBadges(S.role);
  }catch(e){alert('Erreur lors de la suppression.');}
}

async function loadAdminDash(){
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  const today=new Date().toISOString().slice(0,10);
  const mStart=today.slice(0,7)+'-01';

  // Bonjour header
  const bj=document.getElementById('dash-bonjour');
  if(bj){
    const prenom=localStorage.getItem('sv_prenom');
    bj.textContent='Bonjour'+(prenom?' '+prenom:'');
  }

  // Fetch all data in parallel
  let allPre=[],allCli=[],allKits=[],allInc=[],todayPre=[];
  try{
    [allPre,allCli,allKits,allInc,todayPre]=await Promise.all([
      sbFetch('prestations?select=id,statut,statut_financier,montant_ttc,date_prestation,heure_debut,heure_fin,reference,type_prestation,clients(nom)&order=date_prestation.asc&limit=500'),
      sbFetch('clients?select=id,statut'),
      sbFetch('kits?select=id,nom,statut&order=nom.asc'),
      sbFetch('incidents?select=id&cloture=eq.false'),
      sbFetch('prestations?select=id,reference,heure_debut,heure_fin,lieu,type_prestation,statut,clients(nom)&date_prestation=eq.'+today+'&order=heure_debut.asc'),
    ]);
  }catch(e){}

  // KPIs
  const prestJour=(todayPre||[]).length;
  const cliActifs=(allCli||[]).filter(c=>c.statut==='client').length;
  const incOuverts=(allInc||[]).length;
  set('kpi-jour',prestJour);
  set('kpi-jour-s',prestJour>1?'prestations':'prestation');
  set('kpi-cli-v',cliActifs);
  set('kpi-inc-v',incOuverts);

  // CA du mois (prestations payées/partiellement payées ce mois)
  const caM=(allPre||[]).filter(p=>p.date_prestation&&p.date_prestation>=mStart&&['payée','partiellement_payée'].includes(p.statut_financier)).reduce((s,p)=>s+(p.montant_ttc||0),0);
  set('kpi-ca-m',caM.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})+' €');

  // À encaisser (facturées + partiellement payées + en retard)
  const aEnc=(allPre||[]).filter(p=>['facturée','partiellement_payée','en_retard'].includes(p.statut_financier)).reduce((s,p)=>s+(p.montant_ttc||0),0);
  set('kpi-enc',aEnc.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})+' €');
  const nbEnc=(allPre||[]).filter(p=>['facturée','partiellement_payée','en_retard'].includes(p.statut_financier)).length;
  set('kpi-enc-s',nbEnc+' facture'+(nbEnc>1?'s':''));

  // CA facturé total (pour le graphique)
  const caTotal=(allPre||[]).filter(p=>['payée','partiellement_payée'].includes(p.statut_financier)).reduce((s,p)=>s+(p.montant_ttc||0),0);
  set('dash-ca',caTotal.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0}));

  // Planning du jour
  const elToday=document.getElementById('dash-today');
  if(elToday){
    if(!todayPre||!todayPre.length){
      elToday.innerHTML='<div style="padding:20px;text-align:center;color:var(--t3);font-size:13px">Aucune prestation planifiée aujourd\'hui.</div>';
    } else {
      const sCl={'confirmée':'ba','planifiée':'ba','prête':'ba','production_démarrée':'bl','livrée':'bg','annulée':'bb'};
      elToday.innerHTML='<div style="padding:0 0 4px">'+todayPre.map(p=>{
        const h=p.heure_debut?p.heure_debut.slice(0,5):'--:--';
        const hf=p.heure_fin?p.heure_fin.slice(0,5):'';
        return`<div style="display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--bd)">
          <div style="min-width:52px;font-size:12px;font-weight:600;color:var(--ac);font-variant-numeric:tabular-nums">${h}${hf?' - '+hf:''}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.clients?.nom||'—'}</div>
            <div style="font-size:11px;color:var(--t3)">${p.type_prestation||''}</div>
          </div>
          <span class="bd ${sCl[p.statut]||'bw'}" style="white-space:nowrap"><span class="bd-d"></span>${SL[p.statut]||p.statut}</span>
          <button class="btn bg2" style="padding:3px 8px;font-size:11px" onclick="modalDetailById('${p.id}')">Ouvrir</button>
        </div>`;
      }).join('')+'</div>';
    }
  }

  // Suivi de production
  const elProd=document.getElementById('dash-prod');
  if(elProd&&allPre){
    const stages=[
      {lb:'À tourner',col:'#366BFF',sts:['confirmée','planifiée','équipe_affectée','prête','équipe_en_route','arrivée_sur_place','production_démarrée']},
      {lb:'En tri',col:'#00B8D4',sts:['production_terminée','médias_à_transférer','médias_complets']},
      {lb:'En retouche',col:'#F5A524',sts:['à_monter']},
      {lb:'En montage',col:'#7C4DFF',sts:['montage_en_cours']},
      {lb:'À valider',col:'#FF6B35',sts:['prêt_validation','à_valider_client']},
      {lb:'À livrer',col:'#2ECC8A',sts:['prête_à_livrer']},
    ];
    elProd.innerHTML=stages.map(s=>{
      const n=allPre.filter(p=>s.sts.includes(p.statut)).length;
      return`<div style="background:var(--c2);border-radius:8px;padding:10px 12px;text-align:center;border-top:2px solid ${s.col}">
        <div style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:${n>0?s.col:'var(--t3)'}">${n}</div>
        <div style="font-size:10px;color:var(--t3);margin-top:3px;white-space:nowrap">${s.lb}</div>
      </div>`;
    }).join('');
  }

  // À traiter
  const elTraiter=document.getElementById('dash-traiter');
  const elNb=document.getElementById('dash-traiter-nb');
  if(elTraiter){
    const items=[];
    // Factures en retard
    const enRetard=(allPre||[]).filter(p=>p.statut_financier==='en_retard');
    enRetard.forEach(p=>items.push({ic:'🔴',txt:`Facture en retard — ${p.clients?.nom||p.reference||'?'}`,act:`modalDetailById('${p.id}')`}));
    // Incidents ouverts
    if(incOuverts>0) items.push({ic:'⚠️',txt:`${incOuverts} incident${incOuverts>1?'s':''} ouvert${incOuverts>1?'s':''}`,act:`switchView('incidents')`});
    // Prestations confirmées sans équipe
    try{
      const sansEquipe=await sbFetch('prestations?select=id,reference,clients(nom)&statut=in.(confirmée,planifiée)&order=date_prestation.asc&limit=20');
      if(sansEquipe&&sansEquipe.length){
        // On vérifie lesquelles n'ont vraiment pas d'équipe
        const equipeIds=await sbFetch('prestations_equipe?select=prestation_id');
        const withTeam=new Set((equipeIds||[]).map(e=>e.prestation_id));
        sansEquipe.filter(p=>!withTeam.has(p.id)).slice(0,3).forEach(p=>{
          items.push({ic:'👥',txt:`Sans équipe — ${p.clients?.nom||p.reference||'?'}`,act:`modalDetailById('${p.id}')`});
        });
      }
    }catch(e){}
    if(elNb) elNb.textContent=items.length||'0';
    if(!items.length){
      elTraiter.innerHTML='<div style="padding:16px;text-align:center;color:var(--t3);font-size:13px">Rien à traiter pour l\'instant.</div>';
    } else {
      elTraiter.innerHTML=items.map(it=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--bd);cursor:pointer" onclick="${it.act}">
        <span style="font-size:16px">${it.ic}</span>
        <div style="flex:1;font-size:13px">${it.txt}</div>
        <span style="font-size:11px;color:var(--ac)">›</span>
      </div>`).join('');
    }
  }

  // Kits utilisés
  const elKits=document.getElementById('dash-kits-live');
  if(elKits){
    const kitsUses=(allKits||[]).filter(k=>k.statut!=='disponible');
    if(!kitsUses.length){
      elKits.innerHTML='<div style="padding:16px;text-align:center;color:var(--t3);font-size:13px">Tous les kits sont disponibles.</div>';
    } else {
      const sc={'sorti':'#F5A524','en_prestation':'#F0445E','pré_réservé':'#366BFF','réservé':'#7C4DFF','en_maintenance':'#FF6B35','endommagé':'#F0445E','indisponible':'#888'};
      elKits.innerHTML=kitsUses.map(k=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--bd)">
        <div style="width:8px;height:8px;border-radius:50%;background:${sc[k.statut]||'#888'};flex-shrink:0"></div>
        <div style="flex:1;font-size:13px">${k.nom}</div>
        <span style="font-size:11px;color:var(--t3)">${k.statut}</span>
      </div>`).join('');
    }
  }

  // Mini bar chart CA (6 derniers mois)
  const mc=document.getElementById('mc');
  if(mc&&allPre){
    const months=[];
    for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);months.push(d.toISOString().slice(0,7));}
    const vals=months.map(m=>(allPre||[]).filter(p=>p.date_prestation&&p.date_prestation.slice(0,7)===m&&['payée','partiellement_payée'].includes(p.statut_financier)).reduce((s,p)=>s+(p.montant_ttc||0),0));
    const mx=Math.max(...vals,1);
    mc.style.cssText='display:flex;align-items:flex-end;gap:4px;height:70px';
    mc.innerHTML=vals.map((v,i)=>{
      const pct=Math.round((v/mx)*100);
      const isCur=i===5;
      return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
        <div style="width:100%;background:${isCur?'var(--ac)':'rgba(54,107,255,.3)'};border-radius:3px 3px 0 0;height:${pct}%;min-height:2px;transition:height .3s"></div>
        <div style="font-size:9px;color:var(--t3)">${months[i].slice(5)}</div>
      </div>`;
    }).join('');
  }
}

async function loadPhotoDash(){
  const uid=localStorage.getItem('sv_uid');
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  const elPre=document.getElementById('photo-dash-pre');
  const elNext=document.getElementById('photo-next');
  if(!uid)return;
  try{
    const data=await sbFetch('prestations_equipe?select=prestation:prestations(id,reference,statut,type_prestation,date_prestation,lieu,clients(nom))&collaborateur_id=eq.'+uid+'&order=prestation.date_prestation.asc');
    const prestations=(data||[]).map(d=>d.prestation).filter(Boolean);
    const now=new Date();now.setHours(0,0,0,0);
    const futures=prestations.filter(p=>p.date_prestation&&new Date(p.date_prestation)>=now);
    const done=prestations.filter(p=>['livrée','clôturée'].includes(p.statut));
    set('photo-kpi-pre',prestations.length);
    set('photo-kpi-next',futures.length);
    set('photo-kpi-done',done.length);
    // Next prestation
    if(elNext){
      const next=futures[0];
      if(next){
        const d=new Date(next.date_prestation);
        const day=d.getDate();
        const mon=d.toLocaleDateString('fr-FR',{month:'short'});
        const sLb={'confirmée':'Confirmée','planifiée':'Planifiée','prête':'Prête','production_démarrée':'En prod.'};
        const sCl={'confirmée':'ba','planifiée':'ba','prête':'ba','production_démarrée':'bl'};
        elNext.innerHTML=`<div style="display:flex;gap:20px;padding:16px 18px;align-items:center">
          <div style="width:50px;height:50px;border-radius:12px;background:var(--gr);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0"><span style="font-size:20px;font-weight:800;color:#fff;line-height:1">${day}</span><span style="font-size:9px;color:rgba(255,255,255,.7);text-transform:uppercase">${mon}</span></div>
          <div style="flex:1"><div style="font-size:15px;font-weight:650;color:var(--t1)">${next.clients?.nom||'—'} — ${next.type_prestation||'—'}</div><div style="font-size:12.5px;color:var(--t2);margin-top:3px">${next.lieu||'Lieu non défini'} · <span class="bd ${sCl[next.statut]||'bw'}" style="display:inline-flex"><span class="bd-d"></span>${sLb[next.statut]||next.statut}</span></div></div>
        </div>`;
      }else{
        elNext.innerHTML='<div style="padding:20px;text-align:center;color:var(--t3);font-size:13px">Aucune prochaine prestation planifiée.</div>';
      }
    }
    // List
    if(elPre){
      if(!prestations.length){
        elPre.innerHTML='<div style="padding:24px;text-align:center;color:var(--t3)">Aucune prestation assignée.</div>';
      }else{
        const sLb={'demande_reçue':'Demande','confirmée':'Confirmée','planifiée':'Planifiée','prête':'Prête','production_démarrée':'En prod.','livrée':'Livrée','clôturée':'Clôturée'};
        const sCl={'confirmée':'ba','planifiée':'ba','prête':'ba','production_démarrée':'bl','livrée':'bn','clôturée':'bn'};
        elPre.innerHTML='<div class="tw"><table><thead><tr><th>Réf.</th><th>Client</th><th>Type</th><th>Date</th><th>Statut</th></tr></thead><tbody>'+
          prestations.map(p=>`<tr><td class="tm">${p.reference||'—'}</td><td class="tp">${p.clients?.nom||'—'}</td><td>${p.type_prestation||'—'}</td><td>${p.date_prestation?new Date(p.date_prestation).toLocaleDateString('fr-FR'):'—'}</td><td><span class="bd ${sCl[p.statut]||'bw'}"><span class="bd-d"></span>${sLb[p.statut]||p.statut}</span></td></tr>`).join('')+
        '</tbody></table></div>';
      }
    }
  }catch(e){
    if(elPre)elPre.innerHTML='<div style="padding:20px;color:var(--er)">Erreur de chargement.</div>';
    if(elNext)elNext.innerHTML='';
  }
}

async function loadRapprochement(){
  const el=document.getElementById('rap-real');
  if(!el)return;
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  const fmt=n=>n.toLocaleString('fr-FR',{minimumFractionDigits:0})+' €';
  try{
    const data=await sbFetch('prestations?select=reference,statut_financier,montant_ttc,date_prestation,clients(nom)&statut_financier=not.in.(non_facturée,en_préparation,annulée)&order=date_prestation.desc&limit=200');
    const list=data||[];
    const enc=list.filter(p=>p.statut_financier==='payée').reduce((s,p)=>s+(p.montant_ttc||0),0);
    const att=list.filter(p=>['facturée','partiellement_payée'].includes(p.statut_financier)).reduce((s,p)=>s+(p.montant_ttc||0),0);
    const ret=list.filter(p=>p.statut_financier==='en_retard').reduce((s,p)=>s+(p.montant_ttc||0),0);
    set('rap-enc',fmt(enc));set('rap-att',fmt(att));set('rap-ret',fmt(ret));
    if(!list.length){el.innerHTML='<div class="cd"><div style="padding:48px;text-align:center;color:var(--t3);font-size:13px">Aucune facturation enregistrée.</div></div>';return;}
    const sf_cls={'payée':'ba','partiellement_payée':'bl','facturée':'bw','en_retard':'bb'};
    const sf_lbl={'payée':'Payé','partiellement_payée':'Part. payé','facturée':'Facturé — en attente','en_retard':'En retard'};
    el.innerHTML='<div class="cd"><div class="tw"><table><thead><tr><th>Référence</th><th>Client</th><th>Montant TTC</th><th>Date</th><th>Statut</th><th></th></tr></thead><tbody>'+
      list.map(p=>`<tr>
        <td class="tm">${p.reference||'—'}</td>
        <td class="tp">${p.clients?.nom||'—'}</td>
        <td class="tm" style="color:var(--t1);font-weight:600">${p.montant_ttc?p.montant_ttc.toLocaleString('fr-FR')+' €':'—'}</td>
        <td>${p.date_prestation?new Date(p.date_prestation).toLocaleDateString('fr-FR'):'—'}</td>
        <td><span class="bd ${sf_cls[p.statut_financier]||'bw'}"><span class="bd-d"></span>${sf_lbl[p.statut_financier]||p.statut_financier}</span></td>
        <td><button class="btn bg2 bs" onclick="modalDetailById('${p.id}')">Ouvrir</button></td>
      </tr>`).join('')+'</tbody></table></div></div>';
  }catch(e){el.innerHTML='<div style="padding:20px;color:var(--er)">Erreur de chargement.</div>';}

      const ct_lbl=p.contrat_signe?'Signé':'À signer';

async function loadTaches(){
  const el=document.getElementById('taches-real');
  if(!el)return;
  const uid=localStorage.getItem('sv_uid');
  try{
    const data=await sbFetch('notifications?select=id,titre,message,lue,created_at&type=eq.tache&destinataire_id=eq.'+uid+'&order=lue.asc,created_at.desc&limit=100');
    const tasks=data||[];
    if(!tasks.length){
      el.innerHTML=`<div class="cd"><div style="display:flex;flex-direction:column;align-items:center;padding:60px;gap:10px;color:var(--t3)"><div style="font-size:40px;opacity:.15">✅</div><div style="font-size:13px">Aucune tâche en cours. Créez-en une.</div></div></div>`;
      return;
    }
    const open=tasks.filter(t=>!t.lue);
    const done=tasks.filter(t=>t.lue);
    const renderTask=(t)=>`<div style="display:flex;align-items:flex-start;gap:12px;padding:11px 18px;border-bottom:1px solid var(--bd);cursor:pointer;${t.lue?'opacity:.5':''}">
      <div onclick="toggleTache('${t.id}',${t.lue})" style="width:20px;height:20px;border-radius:6px;border:1.5px solid ${t.lue?'var(--ok)':'var(--b2)'};background:${t.lue?'rgba(46,204,138,.15)':'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;cursor:pointer">
        ${t.lue?'<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#2ECC8A" stroke-width="2" stroke-linecap="round"><path d="M2 5l2.5 2.5 4.5-5"/></svg>':''}
      </div>
      <div style="flex:1">
        <div style="font-size:13px;color:${t.lue?'var(--t3)':'var(--t1)'};text-decoration:${t.lue?'line-through':''}">${t.titre}</div>
        ${t.message?`<div style="font-size:11px;color:var(--t3);margin-top:2px">${t.message}</div>`:''}
      </div>
      <button onclick="supprimerTache('${t.id}')" style="background:transparent;border:none;color:var(--t3);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px;opacity:.5;hover:opacity:1">✕</button>
    </div>`;
    el.innerHTML=`
      ${open.length?`<div class="cd" style="margin-bottom:13px"><div class="cd-h"><div class="cd-t">À faire</div><span class="bd bn">${open.length}</span></div>${open.map(renderTask).join('')}</div>`:''}
      ${done.length?`<div class="cd"><div class="cd-h"><div class="cd-t">Terminées</div><span class="bd ba" style="font-size:10px">${done.length}</span></div>${done.map(renderTask).join('')}</div>`:''}`;
  }catch(e){el.innerHTML='<div style="padding:20px;color:var(--er)">Erreur de chargement.</div>';}
}

async function creerTache(){
  const titre=(document.getElementById('ta-titre')?.value||'').trim();
  const msg=(document.getElementById('ta-msg')?.value||'').trim();
  const err=document.getElementById('ta-err');
  if(!titre){if(err)err.textContent='Donnez un nom à la tâche.';return;}
  const uid=localStorage.getItem('sv_uid');
  try{
    await sbFetch('notifications',{method:'POST',body:{
      type:'tache',titre,message:msg||null,lue:false,destinataire_id:uid
    }});
    closeModal();loadTaches();
  }catch(e){if(err)err.textContent='Erreur lors de la création.';}
}

async function toggleTache(id,estFaite){
  try{await sbFetch('notifications?id=eq.'+id,{method:'PATCH',body:{lue:!estFaite}});loadTaches();}
  catch(e){}
}

async function supprimerTache(id){
  try{await sbFetch('notifications?id=eq.'+id,{method:'DELETE'});loadTaches();}
  catch(e){}
}

// ── Export CSV ───────────────────────────────────────────────────────────────
function downloadCSV(rows,filename){
  const BOM='﻿';
  const csv=BOM+rows.map(r=>r.map(v=>'"'+(String(v||'').replace(/"/g,'""'))+'"').join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=filename;a.click();URL.revokeObjectURL(a.href);
}

async function exportCSV(type){
  try{
    if(type==='factures'){
      const data=await sbFetch('prestations?select=reference,statut,statut_financier,type_prestation,date_prestation,montant_ht,montant_ttc,tva_pct,clients(nom)&statut_financier=not.in.(non_facturée)&order=date_prestation.desc&limit=500');
      const rows=[['Référence','Client','Type','Date','Montant HT','TVA %','Montant TTC','Statut facture']];
      (data||[]).forEach(p=>rows.push([p.reference||'',p.clients?.nom||'',p.type_prestation||'',p.date_prestation||'',p.montant_ht||'',p.tva_pct||'20',p.montant_ttc||'',p.statut_financier||'']));
      downloadCSV(rows,'SportVision-Factures-'+new Date().toISOString().slice(0,10)+'.csv');
    }
    else if(type==='ca-mensuel'){
      const data=await sbFetch('prestations?select=date_prestation,montant_ttc,statut_financier&statut_financier=in.(payée,partiellement_payée)&order=date_prestation.asc&limit=500');
      const byMonth={};
      (data||[]).forEach(p=>{if(!p.date_prestation)return;const m=p.date_prestation.slice(0,7);if(!byMonth[m])byMonth[m]={count:0,total:0};byMonth[m].count++;byMonth[m].total+=p.montant_ttc||0;});
      const rows=[['Mois','Nombre prestations','CA TTC (€)']];
      Object.keys(byMonth).sort().forEach(m=>rows.push([m,byMonth[m].count,byMonth[m].total.toFixed(2)]));
      downloadCSV(rows,'SportVision-CA-Mensuel-'+new Date().toISOString().slice(0,10)+'.csv');
    }
    else if(type==='remunerations'){
      const data=await sbFetch('prestations_equipe?select=remuneration,heure_rdv,statut,fonction,prestations(reference,date_prestation),profiles!collaborateur_id(prenom,nom,role)&order=created_at.desc&limit=500');
      const rows=[['Collaborateur','Rôle','Prestation','Date','Fonction','Rémunération (€)','Statut']];
      (data||[]).forEach(e=>rows.push([(e.profiles?.prenom||'')+' '+(e.profiles?.nom||''),e.profiles?.role||'',e.prestations?.reference||'',e.prestations?.date_prestation||'',e.fonction||'',e.remuneration||'0',e.statut||'']));
      downloadCSV(rows,'SportVision-Remunerations-'+new Date().toISOString().slice(0,10)+'.csv');
    }
    else if(type==='clients'){
      const data=await sbFetch('clients?select=nom,statut,type_client,nom_contact,prenom_contact,email,telephone,ville,sport,created_at&order=nom.asc&limit=500');
      const rows=[['Nom','Statut','Type','Contact','Email','Téléphone','Ville','Sport','Créé le']];
      (data||[]).forEach(c=>rows.push([c.nom||'',c.statut||'',c.type_client||'',(c.prenom_contact||'')+' '+(c.nom_contact||''),c.email||'',c.telephone||'',c.ville||'',c.sport||'',c.created_at?new Date(c.created_at).toLocaleDateString('fr-FR'):'']));
      downloadCSV(rows,'SportVision-Clients-'+new Date().toISOString().slice(0,10)+'.csv');
    }
    else if(type==='prestations'){
      const data=await sbFetch('prestations?select=reference,statut,statut_financier,type_prestation,date_prestation,heure_debut,heure_fin,lieu,montant_ht,montant_ttc,notes_internes,clients(nom)&order=date_prestation.desc&limit=500');
      const rows=[['Référence','Client','Type','Date','Heure début','Heure fin','Lieu','Montant HT','Montant TTC','Statut','Statut financier','Notes']];
      (data||[]).forEach(p=>rows.push([p.reference||'',p.clients?.nom||'',p.type_prestation||'',p.date_prestation||'',p.heure_debut||'',p.heure_fin||'',p.lieu||'',p.montant_ht||'',p.montant_ttc||'',p.statut||'',p.statut_financier||'',p.notes_internes||'']));
      downloadCSV(rows,'SportVision-Prestations-'+new Date().toISOString().slice(0,10)+'.csv');
    }
  }catch(e){alert('Erreur lors de l\'export : '+e.message);}
}

async function signalerIncident(){
  const err=document.getElementById('inc-err');
  const type=document.getElementById('inc-type').value.trim();
  const desc=document.getElementById('inc-desc').value.trim();
  if(!type||!desc){err.textContent='Type et description requis.';return;}
  err.textContent='Envoi…';
  try{
    const preRef=document.getElementById('inc-pre').value.trim();
    let pid=null;
    if(preRef){
      const pr=await sbFetch('prestations?select=id&reference=eq.'+encodeURIComponent(preRef));
      if(pr&&pr[0])pid=pr[0].id;
    }
    await sbFetch('incidents',{method:'POST',body:{
      type_incident:type,
      niveau:document.getElementById('inc-niv').value,
      description:desc,
      declare_par:S.uid,
      prestation_id:pid,
    }});
    closeModal();
    loadIncidents();
    updateNavBadges(S.role);
  }catch(e){err.textContent='Erreur lors de l\'envoi.';}
}

    const firstDow=new Date(yr,mo,1).getDay();
    let rows='<div class="cd"><div class="cd-b">';
    for(let d=1;d<=nbDays;d++){
      const date=new Date(yr,mo,d);
      const key=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dow=date.getDay();
      const isToday=key===today;
      const isWE=dow===0||dow===6;
      const pres=byDay[key]||[];
      rows+=`<div style="display:flex;gap:14px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.03);align-items:flex-start${pres.length===0&&!isToday?';opacity:.5':''}">
        <div style="width:48px;flex-shrink:0;text-align:center">
          <div style="font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--t3)">${jours[dow]}</div>
          <div style="font-size:20px;font-weight:700;color:${isToday?'var(--acc)':isWE?'var(--t2)':'var(--t1)'};line-height:1.2;${isToday?'text-shadow:0 0 16px rgba(54,107,255,.5)':''}">${d}</div>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;gap:5px;padding-top:4px">
          ${pres.map(p=>{
            const sc=SC[p.statut]||'bw';
            const clr=sc==='ba'?'rgba(46,204,138,.1)':sc==='bl'?'rgba(240,68,94,.1)':'rgba(54,107,255,.08)';
            const brd=sc==='ba'?'var(--ok)':sc==='bl'?'var(--er)':'var(--acc)';
            const h=p.heure_debut?p.heure_debut.slice(0,5):'';
            const hf=p.heure_fin?'→'+p.heure_fin.slice(0,5):'';
            return `<div style="background:${clr};border-left:3px solid ${brd};border-radius:0 6px 6px 0;padding:6px 10px;cursor:pointer" onclick="modalDetailById('${p.id}')">
              <div style="font-size:12px;font-weight:600;color:var(--t1)">${p.reference||'—'} · ${p.clients?.nom||'—'}</div>
              <div style="font-size:11px;color:var(--t2)">${p.type_prestation||''}${h?' · '+h+' '+hf:''}</div>
            </div>`;
          }).join('')}
          ${pres.length===0?'<div style="font-size:11px;color:var(--t3);padding:2px 0">—</div>':''}
        </div>
      </div>`;
    }
    rows+='</div></div>';
    el.innerHTML=rows;
  }catch(e){el.innerHTML='<div style="padding:20px;color:var(--er)">Erreur de chargement.</div>';}
}

// ── Finances admin ───────────────────────────────────────────────────────────
async function loadFinances(){
  const el=document.getElementById('fin-real');
  if(!el)return;
  try{
    const data=await sbFetch('prestations?select=id,reference,statut,statut_financier,type_prestation,date_prestation,montant_ht,montant_ttc,clients(nom)&montant_ttc=not.is.null&order=date_prestation.desc&limit=100');
    const list=data||[];
    let enc=0,total=0,att=0;
    list.forEach(p=>{
      const m=p.montant_ttc||0;
      if(['payée'].includes(p.statut_financier))enc+=m;
      if(['facturée','partiellement_payée','payée'].includes(p.statut_financier))total+=m;
      if(['facturée','partiellement_payée'].includes(p.statut_financier))att+=m;
    });
    const fmt=n=>n.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})+' €';
    const s1=document.getElementById('fin-ca-enc');if(s1)s1.innerHTML=fmt(enc);
    const s2=document.getElementById('fin-ca-total');if(s2)s2.innerHTML=fmt(total);
    const s3=document.getElementById('fin-en-attente');if(s3)s3.innerHTML=fmt(att);
    if(list.length===0){el.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;padding:48px;gap:10px;color:var(--t3)"><div style="font-size:36px;opacity:.2">💶</div><div>Aucune prestation avec montant renseigné.</div></div>';return;}
    el.innerHTML='<div class="tw"><table><thead><tr><th>Référence</th><th>Client</th><th>Type</th><th>Date</th><th>Montant TTC</th><th>Statut financier</th></tr></thead><tbody>'+
      list.map(p=>{
        const sf=p.statut_financier||'non_facturée';
        const sc={'payée':'ba','partiellement_payée':'bw','facturée':'bw','non_facturée':'bb','en_préparation':'bl'}[sf]||'bw';
        const sl={'payée':'Payée','partiellement_payée':'Part. payée','facturée':'Facturée','non_facturée':'Non facturée','en_préparation':'En préparation','en_retard':'En retard','annulée':'Annulée'}[sf]||sf;
        return `<tr>
          <td class="tm">${p.reference||'—'}</td>
          <td class="tp">${p.clients?.nom||'—'}</td>
          <td>${p.type_prestation||'—'}</td>
          <td>${p.date_prestation?new Date(p.date_prestation).toLocaleDateString('fr-FR'):'—'}</td>
          <td class="tm" style="color:var(--t1);font-weight:600">${p.montant_ttc?p.montant_ttc.toLocaleString('fr-FR')+' €':'—'}</td>
          <td><span class="bd ${sc}"><span class="bd-d"></span>${sl}</span></td>
        </tr>`;
      }).join('')+
    '</tbody></table></div>';
  }catch(e){el.innerHTML='<div style="padding:20px;color:var(--er)">Erreur de chargement.</div>';}
}

async function loadCollaborateurs(){
  const el=document.getElementById('col-real');
  if(!el)return;
  try{
    const data=await sbFetch('profiles?select=id,role,prenom,nom,telephone&order=role.asc,nom.asc');
    if(!data||data.length===0){el.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;padding:48px;gap:10px;color:var(--t3)"><div style="font-size:36px;opacity:.2">👥</div><div>Aucun collaborateur trouvé.</div></div>';return;}
    _colsCache=data;
    const rColors={'admin':'#366BFF','sec':'#00B8D4','prod':'#2ECC8A','photo':'#7C4DFF','cm':'#F5A524','compta':'#FF6B35','com':'#F0445E'};
    const rLabels={'admin':'Administrateur','sec':'Secrétaire','prod':'Resp. Production','photo':'Photographe','cm':'Community Manager','compta':'Comptable','com':'Commercial'};
    el.innerHTML='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:13px">'+
      data.map((t,i)=>{
        const ini=((t.prenom?t.prenom[0]:'')+(t.nom?t.nom[0]:'')).toUpperCase()||t.role.substring(0,2).toUpperCase();
        const name=[t.prenom,t.nom].filter(Boolean).join(' ')||t.role;
        const col=rColors[t.role]||'#366BFF';
        return`<div style="background:var(--s1);border:1px solid var(--b1);border-radius:var(--rc);padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
          <div class="av" style="width:50px;height:50px;font-size:17px;font-weight:700;background:${col}">${ini}</div>
          <div style="font-size:13px;font-weight:650;color:var(--t1)">${name}</div>
          <span style="font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:2px 8px;border-radius:var(--rp);background:rgba(255,255,255,.07);color:var(--t2)">${rLabels[t.role]||t.role}</span>
          ${t.telephone?`<div style="font-size:11px;color:var(--t3)">${t.telephone}</div>`:''}
          <button onclick="modalModifierCollaborateur(${i})" style="padding:5px 14px;font-size:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:var(--rp);color:var(--t2);cursor:pointer;width:100%">Modifier</button>
        </div>`;
      }).join('')+'</div>';
  }catch(e){el.innerHTML='<div style="padding:20px;color:var(--er)">Erreur de chargement.</div>';}
}

function modalModifierCollaborateur(idx){
  const t=_colsCache[idx];
  if(!t)return;
  const lbl='font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);display:block;margin-bottom:5px';
  const rLabels={'admin':'Administrateur','sec':'Secrétaire','prod':'Resp. Production','photo':'Photographe','cm':'Community Manager','compta':'Comptable','com':'Commercial'};
  openModal(`
    <div style="font-size:16px;font-weight:700;color:var(--t1);margin-bottom:4px">Modifier le collaborateur</div>
    <div style="font-size:12px;color:var(--t3);margin-bottom:20px">${rLabels[t.role]||t.role}</div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label style="${lbl}">Prénom</label><input id="fco-prenom" class="l-inp" value="${t.prenom||''}" style="height:38px"></div>
        <div><label style="${lbl}">Nom</label><input id="fco-nom" class="l-inp" value="${t.nom||''}" style="height:38px"></div>
      </div>
      <div><label style="${lbl}">Téléphone</label><input id="fco-tel" type="tel" class="l-inp" value="${t.telephone||''}" style="height:38px"></div>
      <div><label style="${lbl}">Rôle</label>
        <select id="fco-role" class="l-inp" style="height:38px">
          ${['admin','sec','prod','photo','cm','compta','com'].map(r=>`<option value="${r}"${t.role===r?' selected':''}>${rLabels[r]||r}</option>`).join('')}
        </select>
      </div>
      <div id="fco-err" style="font-size:12px;color:var(--er);min-height:14px"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px">
        <button class="btn bg2" onclick="closeModal()">Annuler</button>
        <button class="btn bp" onclick="modifierCollaborateur('${t.id}')">Enregistrer</button>
      </div>
    </div>`);
}
async function modifierCollaborateur(id){
  const err=document.getElementById('fco-err');
  err.textContent='Enregistrement…';
  try{
    await sbFetch('profiles?id=eq.'+id,{method:'PATCH',body:{
      prenom:document.getElementById('fco-prenom').value.trim()||null,
      nom:document.getElementById('fco-nom').value.trim()||null,
      telephone:document.getElementById('fco-tel').value.trim()||null,
      role:document.getElementById('fco-role').value,
    }});
    closeModal();
    loadCollaborateurs();
  }catch(e){err.textContent='Erreur lors de la modification.';}
}

function renderOb(){

    inner=`<div style="display:flex;flex-direction:column;gap:10px">`+
    [['Nouvelle prestation assignée','✅'],['Prestation modifiée','✅'],['Message de l\'équipe','✅'],['Rapport hebdomadaire','']].map(([lb,chk])=>`

// ── APP ──────────────────────────────────
function goApp(role){
  S.role=role;
  const cfg=ROLES[role];
  const nav=NAV[role];
  S.view=nav[0].id;
  document.getElementById('u-av').textContent=cfg.i;
  document.getElementById('u-av').style.background=cfg.c;
  document.getElementById('u-nm').textContent=cfg.r;
  document.getElementById('u-rl').textContent=cfg.r;
  document.getElementById('cta-btn').textContent=cfg.cta;
  document.getElementById('sb-nav').innerHTML=`<div class="nav">`+
    nav.map(item=>`<button class="ni${item.id===S.view?' on':''}" data-id="${item.id}" onclick="switchView('${item.id}')">
      <span class="ni-ic">${IC[item.ic]||''}</span>
      <span class="ni-lb">${item.lb}</span>
      <span class="nb" id="nb-${item.id}" style="display:none"></span>
    </button>`).join('')+`</div>`;
  show('app');
  renderContent();
  // Charge le vrai profil et met à jour les badges
  const uid=localStorage.getItem('sv_uid');
  if(uid){
    sbFetch('profiles?select=prenom,nom&id=eq.'+uid).then(data=>{
      if(data&&data[0]){
        const p=data[0];
        const name=[p.prenom,p.nom].filter(Boolean).join(' ');
        const ini=((p.prenom?.[0]||'')+(p.nom?.[0]||'')).toUpperCase();
        if(name)document.getElementById('u-nm').textContent=name;
        if(ini){document.getElementById('u-av').textContent=ini;}
      }
    }).catch(()=>{});
  }
  updateNavBadges(role);
}

async function updateNavBadges(role){
  function setBadge(id,n,cls){
    const el=document.getElementById('nb-'+id);
    if(!el)return;
    if(n>0){el.textContent=n;el.className='nb '+(cls||'nb-o');el.style.display='';}
    else el.style.display='none';
  }
  try{
    if(['admin','sec','prod'].includes(role)){
      const pre=await sbFetch('prestations?select=id,statut');
      const n=(pre||[]).filter(p=>!['clôturée','annulée','refusée','livrée'].includes(p.statut)).length;
      setBadge('pre',n,'nb-o');
      if(role==='sec')setBadge('crm',(await sbFetch('clients?select=id')||[]).length,'nb-b');
    }
    if(['admin','prod'].includes(role)){
      const kits=await sbFetch('kits?select=id,statut');
      setBadge('kits',(kits||[]).filter(k=>k.statut!=='disponible').length,'nb-r');
    }
    if(role==='prod'){
      const inc=await sbFetch('incidents?select=id&cloture=eq.false');
      setBadge('incidents',(inc||[]).length,'nb-r');
    }
  }catch(e){}
}

function switchView(id){
  S.view=id;
  document.querySelectorAll('.ni[data-id]').forEach(n=>n.classList.toggle('on',n.dataset.id===id));
  const cfg=NAV[S.role].find(n=>n.id===id);
  document.getElementById('pt').textContent=cfg?cfg.lb:'';
  renderContent();
}

function renderContent(){
  const key=`${S.role}.${S.view}`;
  const ct=document.getElementById('app-ct');
  ct.innerHTML=(VIEWS[key]||(()=>fallbackView(S.role,S.view)))();
  if(document.getElementById('mc'))finBars('mc',80);
  if(document.getElementById('fc'))finBars('fc',140);
  loadViewData(S.role,S.view);
}

function ctaAction(){
  const role=S.role;
  if(role==='admin'||role==='prod'||role==='sec') modalNouvellePrestation();
  else if(role==='com') modalNouveauClient();
  else if(role==='cm') switchView('cal');
}

// ── ERRORS ───────────────────────────────
function goError(type){
  const ERR={
    '403':{code:'403',title:'Accès refusé',sub:'Vous n\'avez pas les permissions nécessaires pour accéder à cette page. Contactez l\'administrateur.'},
    '404':{code:'404',title:'Page introuvable',sub:'La page que vous cherchez n\'existe pas ou a été déplacée.'},
    '500':{code:'500',title:'Erreur serveur',sub:'Une erreur interne s\'est produite. L\'équipe technique a été notifiée automatiquement.'},
  };
  const e=ERR[type]||ERR['404'];
  document.getElementById('er-c').innerHTML=`
    <div class="er-code">${e.code}</div>
    <div class="er-title">${e.title}</div>
    <div class="er-sub">${e.sub}</div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn bp" onclick="goLogin()">← Accueil</button>
      ${type==='500'?`<button class="btn bg2" onclick="goLogin()">Réessayer</button>`:''}
    </div>`;
  show('error');
}
