[build]
  publish = "."

[[redirects]]
  from = "/*"
  to = "/SportVision-Portail.html"
  status = 200

# En-têtes de sécurité HTTP (2026-08-06). CSP construite à partir des domaines
# externes réellement appelés : Google Fonts, le projet Supabase (fetch REST/
# auth/functions/storage — y compris les images publiques du bucket, d'où
# l'ajout dans img-src), l'API adresse gouvernementale (autocomplétion
# d'adresse) et Google Tag Manager/Analytics — le code gtag est présent dans
# la page mais désactivé tant que GA_MEASUREMENT_ID est vide ; ces domaines
# sont whitelistés par anticipation pour qu'activer l'ID plus tard (sans
# redéploiement de ce fichier) ne casse pas la mesure d'audience. Le site
# utilise des gestionnaires d'évènements inline (onclick=...) et des <script>
# inline, d'où 'unsafe-inline' sur script-src et style-src.
# HSTS ajouté le 2026-08-07 : tout est servi par Netlify, donc HTTPS par
# défaut sur le domaine exact visité, sans risque. Volontairement SANS
# includeSubDomains (on ne connaît pas encore tous les sous-domaines
# éventuels du domaine définitif) ni preload (engagement long à ne pas
# prendre à la légère) : uniquement max-age sur le domaine exact.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://lulgezzpvrlbftbykzrc.supabase.co; connect-src 'self' https://lulgezzpvrlbftbykzrc.supabase.co https://api-adresse.data.gouv.fr https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; frame-src 'none'; object-src 'none'; base-uri 'self'"
