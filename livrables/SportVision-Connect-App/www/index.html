<!DOCTYPE html>
<!--
  L'écran d'entrée de l'application SportVision (22/09/2026).

  POURQUOI CET ÉCRAN EXISTE. Décision de Fouka : une seule application, pas deux. Les familles
  vivent sur Connect, les dirigeants sur Club+ — deux sites, deux domaines, et surtout DEUX
  SESSIONS : les cookies d'authentification ne traversent pas d'un domaine à l'autre. Un
  aiguillage automatique après connexion obligerait donc le dirigeant à se reconnecter une
  seconde fois, ce qui est exactement ce qu'on cherche à lui épargner.

  On demande donc AVANT la connexion, une fois, et on se souvient. Au lancement suivant,
  l'espace s'ouvre tout seul après un court instant, et un bouton permet toujours de changer :
  sans lui, quelqu'un qui se trompe une fois resterait enfermé du mauvais côté.

  CE QUE CET ÉCRAN NE FAIT PAS. Il ne décide d'aucun droit. Le cloisonnement est en base depuis
  toujours : un parent qui ouvrirait Club+ y lit « Aucun espace disponible », un joueur sur
  Club+ de même. Cet écran choisit une porte, pas une permission.
-->
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>SportVision</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: radial-gradient(120% 80% at 50% 0%, #142a5c 0%, #0b1330 60%);
      color: #f2f4ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; justify-content: center;
      padding: max(28px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom));
    }
    .marque { text-align: center; margin-bottom: 30px; }
    .marque b { font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
    .marque span { display: block; margin-top: 5px; font-size: 11px; letter-spacing: .18em;
      text-transform: uppercase; color: #8ea3d6; }
    h1 { font-size: 19px; font-weight: 700; text-align: center; margin: 0 0 20px; }
    .choix { display: flex; flex-direction: column; gap: 12px; }
    button.carte {
      appearance: none; width: 100%; text-align: left; cursor: pointer;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px; padding: 17px 18px; color: inherit; font: inherit;
      display: flex; align-items: center; gap: 14px;
      transition: background .15s, border-color .15s;
    }
    button.carte:active { background: rgba(255,255,255,.12); border-color: rgba(140,169,255,.6); }
    .ico { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid;
      place-items: center; font-size: 20px; background: rgba(79,125,255,.18); }
    .carte b { display: block; font-size: 15.5px; font-weight: 700; }
    .carte small { display: block; margin-top: 2px; font-size: 12.5px; color: #9fb0d8; line-height: 1.45; }
    #reprise { text-align: center; margin-top: 22px; font-size: 13px; color: #9fb0d8; min-height: 40px; }
    #reprise button { appearance: none; background: none; border: 0; color: #8ea3d6;
      font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px; }
    #hors-ligne { display: none; margin-top: 18px; text-align: center; font-size: 13px; color: #ffb4b4; }
  </style>
</head>
<body>
  <div class="marque">
    <b>SportVision</b>
    <span>Votre sport, vos contenus</span>
  </div>

  <h1 id="titre">Vous entrez comme…</h1>

  <div class="choix">
    <button class="carte" onclick="entrer('famille', true)">
      <span class="ico" aria-hidden="true">⚽</span>
      <span>
        <b>Joueur ou parent</b>
        <small>Vos photos, votre calendrier, vos prestations.</small>
      </span>
    </button>
    <button class="carte" onclick="entrer('club', true)">
      <span class="ico" aria-hidden="true">🛡️</span>
      <span>
        <b>Dirigeant ou coach</b>
        <small>Vos équipes, vos matchs, la communication du club.</small>
      </span>
    </button>
  </div>

  <!-- Volontairement un lien et non une troisieme carte : cet ecran est d'abord celui des
       familles, et l'equipe interne sait ou elle va. Personne d'autre ne peut entrer de toute
       facon — l'OS demande un compte du staff. -->
  <p id="interne" style="text-align:center;margin:20px 0 0;font-size:12.5px">
    <button type="button" onclick="entrer('equipe', true)"
      style="appearance:none;background:none;border:0;color:#7e93c4;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px">
      Je fais partie de l&rsquo;équipe SportVision
    </button>
  </p>

  <div id="reprise"></div>
  <div id="hors-ligne">Pas de connexion internet. Vérifiez votre réseau, puis réessayez.</div>

<script>
  var DESTINATIONS = {
    famille: "https://connect.sportvision-an.fr",
    club: "https://clubplus.sportvision-an.fr/clubplus",
    // 22/09/2026 — L'equipe SportVision voulait une application, pas un raccourci de navigateur.
    // Elle passe par la meme, plutot qu'une seconde publication : Apple refuse les applications
    // reservees aux employes sur l'App Store public, et exposer l'outil interne dans un magasin
    // n'a aucun interet. Une porte de plus, et un seul passage en revue.
    equipe: "https://bc6m3cgdz.sportvision-an.fr/SportVision-OS-Full.html"
  };
  var CLE = "sv-espace";

  function entrer(espace, choisi) {
    try { if (choisi) localStorage.setItem(CLE, espace); } catch (e) { /* mode privé : on continue */ }
    if (!navigator.onLine) { document.getElementById("hors-ligne").style.display = "block"; return; }
    location.replace(DESTINATIONS[espace] || DESTINATIONS.famille);
  }

  function oublier() {
    try { localStorage.removeItem(CLE); } catch (e) {}
    clearTimeout(minuterie);
    document.getElementById("reprise").textContent = "";
    document.getElementById("titre").textContent = "Vous entrez comme…";
  }

  // Le dernier choix rouvre l'espace tout seul, mais jamais sans laisser le temps d'y échapper :
  // deux secondes et un bouton. Quelqu'un qui s'est trompé une fois doit pouvoir se reprendre.
  var minuterie = null;
  var memoire = null;
  try { memoire = localStorage.getItem(CLE); } catch (e) {}
  if (memoire && DESTINATIONS[memoire]) {
    var libelle = memoire === "club" ? "votre espace club"
      : memoire === "equipe" ? "SportVision OS" : "votre espace";
    document.getElementById("titre").textContent = "Ouverture de " + libelle + "…";
    document.getElementById("reprise").innerHTML =
      '<button type="button" onclick="oublier()">Ce n\'est pas le bon espace ?</button>';
    minuterie = setTimeout(function () { entrer(memoire, false); }, 2000);
  }
</script>
</body>
</html>
