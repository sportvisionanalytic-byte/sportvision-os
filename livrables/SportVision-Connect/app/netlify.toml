[build]
  publish = "."

# Connect est une app multi-fichiers (index.html + modules/*.js), contrairement
# à Club+ qui est un fichier HTML unique. Les fichiers réels (modules/*.js,
# manifest.json, sw.js, icônes) sont servis tels quels par Netlify ; seule une
# route qui ne correspond à aucun fichier existant retombe sur index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Le service worker ne doit jamais être servi depuis un cache intermédiaire :
# sinon une mise à jour de l'app pourrait ne jamais atteindre les utilisateurs.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# En-têtes de sécurité HTTP (2026-08-06). CSP construite à partir des domaines
# externes réellement appelés : le projet Supabase (fetch REST/auth/functions,
# tous les modules/*.js passent par SB_URL) et l'API adresse gouvernementale
# (autocomplétion d'adresse dans projet-configurateur.js). Aucun Google Fonts
# ni police externe : l'app n'utilise que la pile de polices système. Le site
# utilise des <script> inline (index.html) et des gestionnaires d'évènements
# construits en JS, d'où 'unsafe-inline' sur script-src et style-src.
# HSTS ajouté le 2026-08-07 : tout est servi par Netlify, donc HTTPS par
# défaut sur le domaine exact visité, sans risque. Volontairement SANS
# includeSubDomains (on ne connaît pas encore tous les sous-domaines
# éventuels du domaine définitif) ni preload (engagement long à ne pas
# prendre à la légère) : uniquement max-age sur le domaine exact.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://lulgezzpvrlbftbykzrc.supabase.co https://api-adresse.data.gouv.fr; frame-src 'none'; object-src 'none'; base-uri 'self'"
