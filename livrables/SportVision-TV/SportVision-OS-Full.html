function goApp(role){
  S.role=role;
  const cfg=ROLES[role];
  const nav=NAV[role];
  S.view=nav[0].id;
  document.getElementById('u-av').textContent=cfg.i;
  document.getElementById('u-av').style.background=cfg.c;
  document.getElementById('u-nm').textContent=cfg.r;
  document.getElementById('u-rl').textContent=cfg.r;
  document.getElementById('cta-btn').textContent=cfg.cta;
  document.getElementById('sb-nav').innerHTML=`<div class="nav">`+
    nav.map(item=>`<button class="ni${item.id===S.view?' on':''}" data-id="${item.id}" onclick="switchView('${item.id}')">
      <span class="ni-ic">${IC[item.ic]||''}</span>
      <span class="ni-lb">${item.lb}</span>
      <span class="nb" id="nb-${item.id}" style="display:none"></span>
    </button>`).join('')+`</div>`;
  show('app');
  renderContent();
  const _wp=localStorage.getItem('sv_prenom');
  setTimeout(()=>toast('Bonjour'+(_wp?' '+_wp:'')+'.',  'ok'),500);
  // Charge le vrai profil et met à jour les badges
  const uid=localStorage.getItem('sv_uid');
  if(uid){
    sbFetch('profiles?select=prenom,nom&id=eq.'+uid).then(data=>{
      if(data&&data[0]){
        const p=data[0];
        const name=[p.prenom,p.nom].filter(Boolean).join(' ');
        const ini=((p.prenom?.[0]||'')+(p.nom?.[0]||'')).toUpperCase();
        if(name)document.getElementById('u-nm').textContent=name;
        if(ini){document.getElementById('u-av').textContent=ini;}
        if(p.prenom)localStorage.setItem('sv_prenom',p.prenom);
        const bj=document.getElementById('dash-bonjour');
        if(bj&&p.prenom)bj.textContent='Bonjour '+p.prenom;
      }
    }).catch(()=>{});
  }
  updateNavBadges(role);
  // Rafraîchir les badges toutes les 60 secondes
  if(window._badgeTimer)clearInterval(window._badgeTimer);
  window._badgeTimer=setInterval(()=>{if(S.screen==='app')updateNavBadges(S.role);},60000);
}

async function updateNavBadges(role){
  function setBadge(id,n,cls){
    const el=document.getElementById('nb-'+id);
    if(!el)return;
    if(n>0){el.textContent=n>99?'99+':n;el.className='nb '+(cls||'nb-o');el.style.display='';}
    else el.style.display='none';
  }
  // Update notification dot on bell
  function setDot(n){const d=document.querySelector('.ndot');if(d){d.style.display=n>0?'':'none';}}
  try{
    const uid=localStorage.getItem('sv_uid');
    // All roles: notification bell dot
    if(uid){
      const notifs=await sbFetch('notifications?select=id&destinataire_id=eq.'+uid+'&lue=eq.false&type=not.in.(tache,contenu,message)');
      setDot((notifs||[]).length);
    }
    if(['admin','sec','prod'].includes(role)){
      const pre=await sbFetch('prestations?select=id,statut');
      const n=(pre||[]).filter(p=>!['clôturée','annulée','refusée','livrée'].includes(p.statut)).length;
      setBadge('pre',n,'nb-o');
    }
    if(role==='sec'){
      setBadge('crm',(await sbFetch('clients?select=id')||[]).length,'nb-b');
      const taches=await sbFetch('notifications?select=id&type=eq.tache&lue=eq.false&destinataire_id=eq.'+uid);
      setBadge('taches',(taches||[]).length,'nb-r');
    }
    if(['admin','prod'].includes(role)){
      const kits=await sbFetch('kits?select=id,statut');
      setBadge('kits',(kits||[]).filter(k=>k.statut!=='disponible').length,'nb-r');
    }
    if(['admin','prod'].includes(role)){
      const inc=await sbFetch('incidents?select=id&cloture=eq.false');
      setBadge('incidents',(inc||[]).length,'nb-r');
      if(role==='admin')setBadge('pipeline',(await sbFetch('clients?select=id&statut=in.(prospect,qualifié)')||[]).length,'nb-o');
    }
    if(role==='cm'){
      const prog=await sbFetch('notifications?select=id&type=eq.contenu&lue=eq.false');
      setBadge('contenus',(prog||[]).length,'nb-o');
    }
    if(role==='com'){
      const prospects=await sbFetch('clients?select=id&statut=in.(prospect,qualifié)');
      setBadge('pipeline',(prospects||[]).length,'nb-o');
    }
    if(['com','admin','sec'].includes(role)){
      const devisAtt=await sbFetch('devis?select=id&statut=in.(envoyé,en_attente)');
      setBadge('devis',(devisAtt||[]).length,'nb-o');
    }
    if(role==='compta'){
      const retard=await sbFetch('prestations?select=id&statut_financier=eq.en_retard');
      setBadge('rapprochement',(retard||[]).length,'nb-r');
    }
    if(role==='photo'){
      const inv=await sbFetch('prestations_equipe?select=id&collaborateur_id=eq.'+uid+'&statut=eq.invitation_envoyée');
      setBadge('dash',(inv||[]).length,'nb-r');
    }
  }catch(e){}
}

// ── Recherche globale ─────────────────────────────────────────────────────────
let _searchTimer=null;
function openSearch(){
  openModal(`<div class="mh"><div class="mt">Recherche</div><button class="mc" onclick="closeModal()">✕</button></div>
    <div class="mb" style="min-height:200px">
      <input type="text" id="gsq" class="fi" placeholder="Client, prestation, référence…" autofocus oninput="debounceSearch(this.value)">
      <div id="gs-res" style="margin-top:12px"></div>
    </div>`);
  setTimeout(()=>document.getElementById('gsq')?.focus(),80);
}
function debounceSearch(q){
  if(_searchTimer)clearTimeout(_searchTimer);
  if(q.trim().length<2){document.getElementById('gs-res').innerHTML='';return;}
  _searchTimer=setTimeout(()=>runSearch(q.trim()),280);
}
async function runSearch(q){
  const el=document.getElementById('gs-res');
  if(!el)return;
  el.innerHTML='<div style="color:var(--t3);font-size:12px;padding:8px">Recherche…</div>';
  const hasPre=['admin','sec','prod'].includes(S.role);
  const hasPhoto=['photo','cm'].includes(S.role);
  const hasCRM=['admin','sec'].includes(S.role);
  const hasPipeline=S.role==='com';
  const hasDevis=['admin','sec','com'].includes(S.role);
  try{
    const qEnc=encodeURIComponent(q);
    const uid=localStorage.getItem('sv_uid');
    const fetches=[];
    if(hasPre){
      fetches.push(sbFetch('prestations?select=id,reference,statut,date_prestation,clients(nom)&or=(reference.ilike.*'+qEnc+'*,lieu.ilike.*'+qEnc+'*)&limit=8'));
    }else if(hasPhoto){
      const q2=q.toLowerCase();
      fetches.push(
        sbFetch('prestations_equipe?select=prestations(id,reference,statut,date_prestation,clients(nom))&collaborateur_id=eq.'+uid)
        .then(data=>(data||[]).filter(r=>r.prestations&&((r.prestations.reference||'').toLowerCase().includes(q2)||(r.prestations.clients?.nom||'').toLowerCase().includes(q2))).slice(0,8).map(r=>r.prestations))
      );
    }else{
      fetches.push(Promise.resolve([]));
    }
    if(hasCRM||hasPipeline)fetches.push(sbFetch('clients?select=id,nom,statut,ville,sport&or=(nom.ilike.*'+qEnc+'*,ville.ilike.*'+qEnc+'*,email.ilike.*'+qEnc+'*)&limit=8'));
    else fetches.push(Promise.resolve([]));
    if(hasDevis)fetches.push(sbFetch('devis?select=id,numero,statut,clients(nom)&or=(numero.ilike.*'+qEnc+'*,notes.ilike.*'+qEnc+'*)&limit=5'));
    else fetches.push(Promise.resolve([]));
    const [pre,cli,dev]=await Promise.all(fetches);
    const rows=[];
    (pre||[]).forEach(p=>rows.push({icon:'📋',title:p.reference||'—',sub:(p.clients?.nom||'')+(p.date_prestation?' · '+new Date(p.date_prestation).toLocaleDateString('fr-FR'):''),action:`closeModal();modalDetailById('${p.id}')`}));
    (cli||[]).forEach(c=>{const nm=c.nom.replace(/'/g,"\\'");const dest=hasPipeline?'pipeline':'crm';rows.push({icon:'👥',title:c.nom||'—',sub:[c.ville,c.sport].filter(Boolean).join(' · ')||c.statut,action:`closeModal();_crmFiltre='${nm}';_crmStFiltre='';switchView('${dest}')`});});
    (dev||[]).forEach(d=>rows.push({icon:'📄',title:d.numero||'Devis',sub:(d.clients?.nom||'—')+' · '+(d.statut||''),action:`closeModal();switchView('devis')`}));
    if(!rows.length){
      const canCreatePre=['admin','sec','prod'].includes(S.role);
      const canCreateCli=['admin','sec'].includes(S.role);
      el.innerHTML='<div style="color:var(--t3);font-size:13px;padding:8px 0">Aucun résultat pour "'+q+'".</div>'
        +(canCreatePre||canCreateCli?'<div style="display:flex;gap:8px;margin-top:8px">'
          +(canCreateCli?'<button class="btn bg2 bs" onclick="closeModal();modalNouveauClient()">+ Nouveau client</button>':'')
          +(canCreatePre?'<button class="btn bp bs" onclick="closeModal();modalNouvellePrestation()">+ Nouvelle prestation</button>':'')
        +'</div>':'');
      return;
    }
    el.innerHTML=rows.map(r=>`<div onclick="${r.action}" style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;background:transparent;transition:background .1s" onmouseover="this.style.background='rgba(255,255,255,.05)'" onmouseout="this.style.background='transparent'">
      <span style="font-size:18px">${r.icon}</span>
      <div><div style="font-size:13px;font-weight:500;color:var(--t1)">${r.title}</div><div style="font-size:11px;color:var(--t3)">${r.sub}</div></div>
    </div>`).join('');
  }catch(e){el.innerHTML='<div style="color:var(--er);font-size:12px;padding:8px">Erreur de recherche.</div>';}
}

// ── Panneau notifications ─────────────────────────────────────────────────────
async function openNotifPanel(){
  const uid=localStorage.getItem('sv_uid');
  openModal(`<div class="mh"><div class="mt">Notifications</div><button class="mc" onclick="closeModal()">✕</button></div>
    <div class="mb" id="notif-panel-body"><div style="text-align:center;padding:30px;color:var(--t3);font-size:13px">Chargement…</div></div>`);
  try{
    const data=await sbFetch('notifications?select=id,type,titre,message,lue,created_at&destinataire_id=eq.'+uid+'&type=not.in.(tache,contenu,message)&order=created_at.desc&limit=20');
    const el=document.getElementById('notif-panel-body');
    if(!el)return;
    if(!data||!data.length){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--t3);font-size:13px">Aucune notification.</div>';return;}
    const unread=data.filter(n=>!n.lue);
    el.innerHTML=(unread.length?`<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn bg2 bs" onclick="marquerToutLu('${uid}')">Tout marquer lu</button></div>`:'')
      +data.map(n=>`<div style="display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd);${!n.lue?'background:rgba(54,107,255,.04)':''};cursor:pointer" onclick="marquerNotifLu('${n.id}')">
        <div style="width:8px;height:8px;border-radius:50%;background:${!n.lue?'var(--ac)':'transparent'};flex-shrink:0;margin-top:4px"></div>
        <div>
          <div style="font-size:13px;color:var(--t1);font-weight:${!n.lue?'600':'400'}">${n.titre}</div>
          ${n.message?`<div style="font-size:11px;color:var(--t3);margin-top:2px">${n.message}</div>`:''}
          <div style="font-size:10px;color:var(--t3);margin-top:3px">${new Date(n.created_at).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
        </div>
      </div>`).join('');
    // Update dot
    document.querySelector('.ndot').style.display=unread.length>0?'':'none';
  }catch(e){}
}
async function marquerNotifLu(id){
  try{await sbFetch('notifications?id=eq.'+id,{method:'PATCH',body:{lue:true}});openNotifPanel();}catch(e){}
}
async function marquerToutLu(uid){
  try{await sbFetch('notifications?destinataire_id=eq.'+uid+'&type=not.in.(tache,contenu,message)',{method:'PATCH',body:{lue:true}});openNotifPanel();}catch(e){}
}

function switchView(id){
  if(_msgInterval){clearInterval(_msgInterval);_msgInterval=null;}
  S.view=id;
  document.querySelectorAll('.ni[data-id]').forEach(n=>n.classList.toggle('on',n.dataset.id===id));
  const cfg=NAV[S.role].find(n=>n.id===id);
  document.getElementById('pt').textContent=cfg?cfg.lb:'';
  renderContent();
}

function renderContent(){
  const key=`${S.role}.${S.view}`;
  const ct=document.getElementById('app-ct');
  ct.innerHTML=(VIEWS[key]||(()=>fallbackView(S.role,S.view)))();
  if(document.getElementById('mc'))finBars('mc',80);
  if(document.getElementById('fc'))finBars('fc',140);
  loadViewData(S.role,S.view);
}

function ctaAction(){
  const role=S.role;
  if(role==='admin'||role==='prod'||role==='sec') modalNouvellePrestation();
  else if(role==='com') modalNouveauClient();
  else if(role==='cm') switchView('cal');
}

// ── ERRORS ───────────────────────────────
function goError(type){
  const ERR={
    '403':{code:'403',title:'Accès refusé',sub:'Vous n\'avez pas les permissions nécessaires pour accéder à cette page. Contactez l\'administrateur.'},
    '404':{code:'404',title:'Page introuvable',sub:'La page que vous cherchez n\'existe pas ou a été déplacée.'},
    '500':{code:'500',title:'Erreur serveur',sub:'Une erreur interne s\'est produite. L\'équipe technique a été notifiée automatiquement.'},
  };
  const e=ERR[type]||ERR['404'];
  document.getElementById('er-c').innerHTML=`
    <div class="er-code">${e.code}</div>
    <div class="er-title">${e.title}</div>
    <div class="er-sub">${e.sub}</div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn bp" onclick="goLogin()">← Accueil</button>
      ${type==='500'?`<button class="btn bg2" onclick="goLogin()">Réessayer</button>`:''}
    </div>`;
  show('error');
}
