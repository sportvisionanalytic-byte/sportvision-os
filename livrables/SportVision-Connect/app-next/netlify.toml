[build]
  base = "livrables/SportVision-Connect/app-next"
  command = "npm run build"

# Next.js App Router détecté automatiquement par le Next Runtime de Netlify (zéro config sur le
# rendu : SSR/Server Components/Middleware pris en charge nativement, pas de "publish" à préciser
# ici contrairement aux sites statiques du repo). Variables d'environnement à définir dans
# Netlify (Site settings → Environment variables), jamais ici :
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
