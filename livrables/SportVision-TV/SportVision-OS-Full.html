<title>SportVision OS</title>
<style>
:root{
  --bg:#080A0F;--s1:#181C25;--s2:#11141B;--s3:#1E2330;
  --b1:rgba(255,255,255,.07);--b2:rgba(255,255,255,.12);
  --acc:#366BFF;--acc2:#7C4DFF;--gr:linear-gradient(135deg,#366BFF,#7C4DFF);
  --ok:#2ECC8A;--wa:#F5A524;--er:#F0445E;
  --t1:#F0F2F7;--t2:#8891A8;--t3:#555E73;
  --sw:228px;--rc:16px;--rb:9px;--rp:999px;
  --ff:'Inter',system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ff);background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* SCREENS */
.scr{display:none;height:100vh}
.scr.on{display:flex}

/* ── LOGIN ──────────────────────────────── */
#s-login{align-items:center;justify-content:center;background:var(--bg)}
.lw{width:400px;display:flex;flex-direction:column;gap:28px}
.l-logo{display:flex;align-items:center;gap:12px}
.l-ico{width:36px;height:36px;background:var(--gr);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.l-name{font-size:18px;font-weight:700;color:var(--t1)}
.l-tag{font-size:11px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase}
.l-form{display:flex;flex-direction:column;gap:14px}
.l-form label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--t3);margin-bottom:5px;display:block}
.l-inp{width:100%;height:42px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--rb);padding:0 14px;color:var(--t1);font-size:13.5px;font-family:var(--ff);outline:none;transition:border-color .15s}
.l-inp:focus{border-color:rgba(54,107,255,.5)}
.l-inp::placeholder{color:var(--t3)}
.l-sep{display:flex;align-items:center;gap:12px;color:var(--t3);font-size:12px}
.l-sep::before,.l-sep::after{content:'';flex:1;height:1px;background:var(--b1)}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-btn{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--rb);cursor:pointer;font-family:var(--ff);color:var(--t2);font-size:12px;font-weight:500;transition:border-color .15s,color .15s,background .15s}
.demo-btn:hover{background:var(--s3);color:var(--t1);border-color:var(--b2)}
.demo-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── ONBOARDING ─────────────────────────── */
#s-onboard{align-items:center;justify-content:center;background:var(--bg)}
.obw{width:480px;display:flex;flex-direction:column;gap:32px}
.ob-steps{display:flex;align-items:center;gap:0}
.ob-step{flex:1;height:3px;background:var(--b1);border-radius:var(--rp);transition:background .3s}
.ob-step.done{background:var(--gr)}
.ob-step+.ob-step{margin-left:4px}
.ob-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rc);padding:32px;display:flex;flex-direction:column;gap:20px}
.ob-ico{width:52px;height:52px;border-radius:14px;background:var(--gr);display:flex;align-items:center;justify-content:center;font-size:22px}
.ob-title{font-size:20px;font-weight:700;color:var(--t1)}
.ob-sub{font-size:13.5px;color:var(--t2);line-height:1.6}
.ob-fields{display:flex;flex-direction:column;gap:12px}
.ob-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ob-actions{display:flex;justify-content:space-between;align-items:center;margin-top:4px}

/* ── ERROR ──────────────────────────────── */
#s-error{align-items:center;justify-content:center;background:var(--bg)}
.erw{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;max-width:380px}
.er-code{font-size:96px;font-weight:800;line-height:1;background:var(--gr);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.er-title{font-size:22px;font-weight:700;color:var(--t1)}
.er-sub{font-size:13.5px;color:var(--t2);line-height:1.6}

/* ── APP SHELL ──────────────────────────── */
#s-app{overflow:hidden}
.sb{width:var(--sw);min-width:var(--sw);height:100vh;background:var(--s2);border-right:1px solid var(--b1);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;flex-shrink:0;scrollbar-width:none}
.sb::-webkit-scrollbar{display:none}
.sb-top{padding:17px 15px 15px;border-bottom:1px solid var(--b1);flex-shrink:0}
.sb-logo{display:flex;align-items:center;gap:10px}
.sb-ico{width:30px;height:30px;background:var(--gr);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-txt{display:flex;flex-direction:column;line-height:1}
.sb-n{font-size:13px;font-weight:700;letter-spacing:-.01em}
.sb-s{font-size:9.5px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.nav{padding:10px 10px 4px;flex-shrink:0}
.nl{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);padding:0 7px;margin-bottom:4px;display:block}
.ni{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rb);cursor:pointer;color:var(--t2);font-size:13px;font-weight:500;transition:background .12s,color .12s;margin-bottom:1px;border:none;background:transparent;width:100%;text-align:left;font-family:var(--ff)}
.ni:hover{background:rgba(255,255,255,.05);color:var(--t1)}
.ni.on{background:rgba(54,107,255,.11);color:var(--acc)}
.ni-ic{width:16px;height:16px;opacity:.55;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ni.on .ni-ic,.ni:hover .ni-ic{opacity:1}
.ni-lb{flex:1}
.nb{font-size:10px;font-weight:700;padding:1px 7px;border-radius:var(--rp)}
.nb-b{background:rgba(54,107,255,.18);color:var(--acc)}
.nb-r{background:rgba(240,68,94,.15);color:var(--er)}
.nb-o{background:rgba(245,165,36,.15);color:var(--wa)}
.sb-div{height:1px;background:var(--b1);margin:7px 10px;flex-shrink:0}
.sb-foot{margin-top:auto;border-top:1px solid var(--b1);padding:11px 10px;flex-shrink:0}
.u-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--rb);cursor:pointer;transition:background .12s}
.u-row:hover{background:rgba(255,255,255,.05)}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.u-meta{flex:1;min-width:0}
.u-n{font-size:12px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-r{font-size:10px;color:var(--t3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.tb{height:55px;min-height:55px;background:var(--s2);border-bottom:1px solid var(--b1);display:flex;align-items:center;padding:0 22px;gap:12px;flex-shrink:0}
.tb h1{font-size:15px;font-weight:650;color:var(--t1);flex:1}
.tb span{font-size:11px;color:var(--t3)}
.tb-act{display:flex;align-items:center;gap:8px;margin-left:auto}
.ib{width:34px;height:34px;border-radius:var(--rb);background:var(--s1);border:1px solid var(--b1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2);transition:background .12s,color .12s;position:relative;flex-shrink:0}
.ib:hover{background:rgba(255,255,255,.07);color:var(--t1)}
.ndot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--er);border:1.5px solid var(--s2)}
.ct{flex:1;overflow-y:auto;padding:22px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent}
.ct::-webkit-scrollbar{width:5px}
.ct::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

/* ── SHARED COMPONENTS ──────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--rb);font-size:12.5px;font-weight:600;cursor:pointer;border:none;font-family:var(--ff);transition:opacity .12s,transform .1s;white-space:nowrap}
.btn:hover{opacity:.88}.btn:active{transform:scale(.97)}
.bp{background:var(--gr);color:#fff}
.bg2{background:transparent;color:var(--t2);border:1px solid var(--b1)}
.bg2:hover{color:var(--t1);background:rgba(255,255,255,.05)}
.bs{padding:5px 11px;font-size:11.5px}
.kpi-g{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.kpi{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rc);padding:17px 19px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--kl,var(--acc));opacity:.45}
.kpi-ey{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--t3);margin-bottom:9px}
.kpi-v{font-size:28px;font-weight:700;color:var(--t1);line-height:1;font-variant-numeric:tabular-nums;margin-bottom:9px}
.kpi-d{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--rp)}
.dup{background:rgba(46,204,138,.1);color:var(--ok)}
.ddn{background:rgba(240,68,94,.1);color:var(--er)}
.dnt{background:rgba(255,255,255,.06);color:var(--t2)}
.cd{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rc);overflow:hidden;display:flex;flex-direction:column;margin-bottom:13px}
.cd-h{display:flex;align-items:center;justify-content:space-between;padding:14px 19px;border-bottom:1px solid var(--b1)}
.cd-t{font-size:13px;font-weight:650;color:var(--t1)}
.cd-s{font-size:11px;color:var(--t3);margin-top:1px}
.cd-b{padding:15px 19px;flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px}
.g32{display:grid;grid-template-columns:1.5fr 1fr;gap:13px;margin-bottom:13px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{padding:9px 13px;text-align:left;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--t3);border-bottom:1px solid var(--b1);white-space:nowrap}
tbody tr{border-bottom:1px solid rgba(255,255,255,.035);cursor:pointer;transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody td{padding:11px 13px;color:var(--t2);vertical-align:middle}
.tp{color:var(--t1);font-weight:500}
.tm{font-variant-numeric:tabular-nums;font-family:'SF Mono',Consolas,monospace;font-size:11px;color:var(--t3)}
.bd{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--rp);font-size:10.5px;font-weight:600;white-space:nowrap}
.bd-d{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.bl{background:rgba(240,68,94,.12);color:var(--er)}.bl .bd-d{background:var(--er);animation:bdot 1.4s ease-in-out infinite}
.ba{background:rgba(46,204,138,.1);color:var(--ok)}.ba .bd-d{background:var(--ok)}
.bw{background:rgba(245,165,36,.1);color:var(--wa)}.bw .bd-d{background:var(--wa)}
.bn{background:rgba(255,255,255,.06);color:var(--t3)}.bn .bd-d{background:var(--t3)}
.bb{background:rgba(54,107,255,.1);color:var(--acc)}.bb .bd-d{background:var(--acc)}
@keyframes bdot{0%,100%{opacity:1}50%{opacity:.35}}
.rl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:var(--rp)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.sh-t{font-size:14px;font-weight:650;color:var(--t1)}
.al{display:flex;flex-direction:column}
.ai{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.035)}
.ai:last-child{border-bottom:none}
.ai-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ai-t{font-size:12.5px;color:var(--t2);line-height:1.4}
.ai-t strong{color:var(--t1);font-weight:600}
.ai-ts{font-size:10.5px;color:var(--t3);margin-top:2px}

/* ── KANBAN ─────────────────────────────── */
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;min-height:300px}
.kb::-webkit-scrollbar{height:4px}
.kb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.kb-col{min-width:210px;max-width:210px;background:var(--s2);border:1px solid var(--b1);border-radius:var(--rc);display:flex;flex-direction:column;gap:0}
.kb-head{padding:12px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between}
.kb-ht{font-size:11.5px;font-weight:650;color:var(--t1)}
.kb-cnt{font-size:10px;font-weight:700;background:rgba(255,255,255,.07);color:var(--t2);padding:1px 7px;border-radius:var(--rp)}
.kb-body{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.kb-card{background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:12px;cursor:pointer;transition:border-color .15s,transform .15s}
.kb-card:hover{border-color:rgba(54,107,255,.3);transform:translateY(-1px)}
.kb-ref{font-size:10px;font-weight:600;color:var(--t3);font-family:monospace;margin-bottom:5px}
.kb-cn{font-size:12.5px;font-weight:600;color:var(--t1);margin-bottom:3px}
.kb-ty{font-size:11px;color:var(--t2);margin-bottom:8px}
.kb-av{display:flex;align-items:center;gap:4px}
.av-xs{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0}

/* ── CALENDRIER ÉDITORIAL ─────────────────── */
.cal-g{display:grid;grid-template-columns:80px repeat(7,1fr);gap:0;border:1px solid var(--b1);border-radius:var(--rc);overflow:hidden;margin-bottom:13px}
.cal-cell{padding:9px 10px;border-right:1px solid var(--b1);border-bottom:1px solid var(--b1);min-height:50px}
.cal-cell:last-child{border-right:none}
.cal-day-head{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);text-align:center;padding:8px 4px;background:var(--s2);border-right:1px solid var(--b1);border-bottom:1px solid var(--b1)}
.cal-day-head.today{color:var(--acc)}
.cal-plat{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);display:flex;align-items:center;padding:9px 10px;background:var(--s2);border-right:1px solid var(--b1);border-bottom:1px solid var(--b1)}
.cal-post{background:var(--s3);border-radius:5px;padding:4px 7px;font-size:10.5px;color:var(--t1);margin:3px 0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-post.sched{border-left:2px solid var(--acc)}
.cal-post.pub{border-left:2px solid var(--ok);opacity:.65}

/* ── MODE JOUR J ───────────────────────── */
.jj-hero{background:var(--gr);border-radius:var(--rc);padding:24px;margin-bottom:13px;display:flex;align-items:center;justify-content:space-between}
.jj-info h2{font-size:20px;font-weight:700;color:#fff;margin-bottom:4px}
.jj-info p{font-size:13px;color:rgba(255,255,255,.7)}
.jj-badge{background:rgba(255,255,255,.2);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:var(--rp);margin-top:10px;display:inline-flex;align-items:center;gap:5px}
.jj-dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:bdot 1.2s ease-in-out infinite}
.jj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:13px}
.jj-tile{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rc);padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s}
.jj-tile:hover{border-color:rgba(54,107,255,.3)}
.jj-tile-ico{font-size:22px}
.jj-tile-t{font-size:13px;font-weight:650;color:var(--t1)}
.jj-tile-s{font-size:11px;color:var(--t3)}

/* ── PIPELINE ──────────────────────────── */
.pip{display:flex;gap:11px;overflow-x:auto;padding-bottom:8px}
.pip-col{min-width:200px;background:var(--s2);border:1px solid var(--b1);border-radius:var(--rc);display:flex;flex-direction:column}
.pip-h{padding:11px 13px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between}
.pip-ht{font-size:11.5px;font-weight:650;color:var(--t1)}
.pip-b{padding:9px;display:flex;flex-direction:column;gap:7px;flex:1}
.pip-card{background:var(--s1);border:1px solid var(--b1);border-radius:9px;padding:11px;cursor:pointer;transition:border-color .15s}
.pip-card:hover{border-color:rgba(54,107,255,.3)}
.pip-cn{font-size:12.5px;font-weight:600;color:var(--t1);margin-bottom:3px}
.pip-det{font-size:11px;color:var(--t2)}
.pip-val{font-size:11.5px;font-weight:700;color:var(--ok);margin-top:6px;font-variant-numeric:tabular-nums}

/* ── PROGRESS ──────────────────────────── */
.pg{height:4px;background:rgba(255,255,255,.07);border-radius:var(--rp);overflow:hidden;margin-top:6px}
.pg-f{height:100%;border-radius:var(--rp);background:var(--gr)}

/* ── FIN BARS ──────────────────────────── */
.fb{display:flex;align-items:flex-end;gap:6px;padding-top:8px}
.fb-c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end}
.fb-b{width:100%;border-radius:4px 4px 0 0;min-height:4px;cursor:pointer;transition:opacity .12s}
.fb-b:hover{opacity:.75}
.fb-l{font-size:9.5px;color:var(--t3);font-weight:500}
.fs{background:var(--s1);border:1px solid var(--b1);border-radius:12px;padding:15px 17px}
.fs-l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:7px}
.fs-v{font-size:21px;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}

/* ── TEAM LIST ─────────────────────────── */
.tl{display:flex;flex-direction:column}
.ti{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.035)}
.ti:last-child{border-bottom:none}
.ti-m{flex:1;min-width:0}
.ti-n{font-size:12.5px;font-weight:500;color:var(--t1)}
.ti-k{font-size:11px;color:var(--t3)}

/* ── RESPONSIVE ────────────────────────── */
@media(max-width:1100px){
  :root{--sw:55px}
  .sb-txt,.ni-lb,.nl,.nb,.u-meta{display:none}
  .ni{justify-content:center;padding:9px}
  .sb-foot{padding:8px}
  .u-row{justify-content:center}
  .kpi-g{grid-template-columns:repeat(2,1fr)}
  .g32{grid-template-columns:1fr}
}
@media(max-width:768px){
  :root{--sw:0px}
  .sb{display:none}
  .kpi-g{grid-template-columns:1fr 1fr}
  .ct{padding:14px}
}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<!-- LOGIN -->
<div id="s-login" class="scr on">
  <div class="lw">
    <div class="l-logo">
      <div class="l-ico"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.5l2 4h4l-3.2 2.8 1.2 4L8 10.2 4 12.3l1.2-4L2 5.5h4L8 1.5z" fill="white"/></svg></div>
      <div><div class="l-name">SportVision OS</div><div class="l-tag">Elkana Group · v2.1</div></div>
    </div>
    <div class="l-form">
      <div><label>Adresse email</label><input id="l-email" class="l-inp" type="email" placeholder="nom@sportvision.fr"></div>
      <div><label>Mot de passe</label><input id="l-pass" class="l-inp" type="password" placeholder="••••••••"></div>
      <div id="l-err" style="font-size:12px;color:var(--er);min-height:16px;text-align:center"></div>
      <button id="l-btn" class="btn bp" style="width:100%;justify-content:center;height:42px;font-size:14px" onclick="doLogin()">Se connecter</button>

}

function filterPre(){
  const q=(document.getElementById('s-q')||{value:''}).value.toLowerCase();
  const f=(document.getElementById('s-st')||{value:''}).value;
  document.querySelectorAll('#pre-tb tr').forEach(tr=>{
    const txt=tr.textContent.toLowerCase();
    const st=tr.dataset.st||'';
    tr.style.display=(!q||txt.includes(q))&&(!f||st===f)?'':'none';
  });
}

async function doLogin(){
  const email=(document.getElementById('l-email').value||'').trim();
  const pass=document.getElementById('l-pass').value||'';
  const errEl=document.getElementById('l-err');
  const btn=document.getElementById('l-btn');
  if(!email||!pass){errEl.textContent='Remplissez email et mot de passe.';return;}
  if(!sb){errEl.textContent='Chargement en cours, réessayez.';return;}
  errEl.textContent='';btn.textContent='Connexion…';btn.disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){errEl.textContent='Email ou mot de passe incorrect.';btn.textContent='Se connecter';btn.disabled=false;return;}
  const {data:prof}=await sb.from('profiles').select('role').eq('id',data.user.id).single();
  btn.textContent='Se connecter';btn.disabled=false;
  if(!prof){errEl.textContent='Profil introuvable. Contactez l\'administrateur.';return;}
  goOnboard(prof.role);
}

function goOnboard(role){
  S.obRole=role||'admin';S.obStep=1;show('onboard');renderOb();

function renderOb(){
  const steps=document.getElementById('ob-steps');
  steps.innerHTML=OB_STEPS.map((_,i)=>`<div class="ob-step${i<S.obStep?' done':''}"></div>`).join('');
  const step=OB_STEPS[S.obStep-1];
  const isLast=S.obStep===OB_STEPS.length;
  let inner='';
  if(step.notifs){
    inner=`<div style="display:flex;flex-direction:column;gap:10px">`+
    [['Nouvelle prestation assignée','✅'],['Prestation modifiée','✅'],['Message de l\'équipe','✅'],['Rapport hebdomadaire','']].map(([lb,chk])=>`
      <label style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--s2);border:1px solid var(--b1);border-radius:var(--rb);cursor:pointer">
        <div style="width:18px;height:18px;border-radius:5px;border:1.5px solid ${chk?'var(--acc)':'var(--b2)'};background:${chk?'rgba(54,107,255,.15)':'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0">${chk?'<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"><path d="M2 5l2.5 2.5 4.5-5"/></svg>':''}</div>
        <span style="font-size:13px;color:var(--t1)">${lb}</span>
      </label>`).join('')+'</div>';
  } else if(step.fields){
    inner='<div class="ob-fields">'+step.fields.map(row=>`<div class="ob-row">${row.map(f=>`<div><label style="font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);display:block;margin-bottom:5px">${f.lb}</label><input class="l-inp" placeholder="${f.ph}" style="width:100%;height:38px"></div>`).join('')}</div>`).join('')+'</div>';
  }
  document.getElementById('ob-content').innerHTML=`
    <div class="ob-ico">${step.ico}</div>
    <div class="ob-title">${step.title}</div>
    <div class="ob-sub">${step.sub}</div>
    ${inner}
    <div class="ob-actions">
      ${S.obStep>1?`<button class="btn bg2" onclick="S.obStep--;renderOb()">← Retour</button>`:`<div></div>`}
      <button class="btn bp" onclick="${isLast?`goApp('${S.obRole}')`:'S.obStep++;renderOb()'}">${isLast?'Accéder à l\'espace →':'Continuer →'}</button>

}

function goApp(role){
  S.role=role;
  const cfg=ROLES[role];
  const nav=NAV[role];
  S.view=nav[0].id;
  // User meta
  document.getElementById('u-av').textContent=cfg.i;
  document.getElementById('u-av').style.background=cfg.c;
  document.getElementById('u-nm').textContent=cfg.n;
  document.getElementById('u-rl').textContent=cfg.r;
  document.getElementById('cta-btn').textContent=cfg.cta;
  // Build sidebar nav
  document.getElementById('sb-nav').innerHTML=`<div class="nav">`+
    nav.map(item=>`<button class="ni${item.id===S.view?' on':''}" data-id="${item.id}" onclick="switchView('${item.id}')">
      <span class="ni-ic">${IC[item.ic]||''}</span>
      <span class="ni-lb">${item.lb}</span>
      ${item.nb?`<span class="nb ${item.nc}">${item.nb}</span>`:''}
    </button>`).join('')+`</div>`;
  show('app');
  renderContent();
}

function switchView(id){
  S.view=id;
  document.querySelectorAll('.ni[data-id]').forEach(n=>n.classList.toggle('on',n.dataset.id===id));
  const cfg=NAV[S.role].find(n=>n.id===id);
  document.getElementById('pt').textContent=cfg?cfg.lb:'';
  renderContent();
}

function renderContent(){
  const key=`${S.role}.${S.view}`;
  const ct=document.getElementById('app-ct');
  ct.innerHTML=(VIEWS[key]||()=>fallbackView(S.role,S.view))();
  // Post-render hooks
  if(document.getElementById('mc'))finBars('mc',80);
  if(document.getElementById('fc'))finBars('fc',140);
}

// ── ERRORS ───────────────────────────────
function goError(type){
  const ERR={
    '403':{code:'403',title:'Accès refusé',sub:'Vous n\'avez pas les permissions nécessaires pour accéder à cette page. Contactez l\'administrateur.'},
    '404':{code:'404',title:'Page introuvable',sub:'La page que vous cherchez n\'existe pas ou a été déplacée.'},
    '500':{code:'500',title:'Erreur serveur',sub:'Une erreur interne s\'est produite. L\'équipe technique a été notifiée automatiquement.'},
  };
  const e=ERR[type]||ERR['404'];
  document.getElementById('er-c').innerHTML=`
    <div class="er-code">${e.code}</div>
    <div class="er-title">${e.title}</div>
    <div class="er-sub">${e.sub}</div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn bp" onclick="goLogin()">← Accueil</button>
      ${type==='500'?`<button class="btn bg2" onclick="goLogin()">Réessayer</button>`:''}
    </div>`;
  show('error');
}

// Expose errors on login screen
document.querySelector('.lw').insertAdjacentHTML('beforeend',`

  </div>`);
