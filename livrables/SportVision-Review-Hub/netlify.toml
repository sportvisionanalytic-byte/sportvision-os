[build]
  publish = "."
  functions = "netlify/functions"

# Site volontairement non indexé et non référencé publiquement : ce hub
# documente l'architecture interne (routes, permissions, flux de données).
# noindex empêche l'indexation par les moteurs, pas l'accès — la protection
# d'accès réelle est assurée par l'edge function basic-auth ci-dessous.
[[edge_functions]]
  path = "/*"
  function = "basic-auth"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Phase 2 : le hub appelle desormais le projet Supabase REVIEW (schema
    # reconstruit, RLS reel) pour l'outbox et les sessions persona — jamais
    # la production. connect-src limite explicitement a ce seul projet Review.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://ffjktzmsezfrwmrtlhzo.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'"
