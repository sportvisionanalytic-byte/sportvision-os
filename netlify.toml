[build]
  publish = "livrables/SportVision-TV"
  # Marqueur de version : écrit le commit et la date du build dans version.json, que l'OS affiche
  # discrètement. Sans lui, « je ne vois pas le nouveau bouton » ne se diagnostique qu'en devinant.
  command = "node scripts/stamp-version.mjs"
  # Filtre `ignore` RETIRÉ le 08/09/2026. C'était le TROISIÈME site à le porter, et le seul qui
  # l'avait encore : il a été retiré d'app-next le 05/09 après avoir bloqué tous les déploiements
  # pendant plus de 24 h sans que personne ne le voie, puis d'app-connect le 07/09 après un second
  # incident identique. Le laisser ici revenait à garder la même mine sur le troisième site.
  #
  # Le coût est quelques builds inutiles. Le risque évité est qu'un changement réel ne parte
  # jamais en production, silencieusement, et qu'on teste pendant des heures une version ancienne
  # en croyant que le correctif ne marche pas.

# Domaine privé, non annoncé (bc6m3cgdz.sportvision-an.fr) — voir netlify/edge-functions/
# block-default-domain.js pour le blocage de sportvision-os.netlify.app.
[[edge_functions]]
  path = "/*"
  function = "block-default-domain"

# Défense en profondeur contre l'indexation (en plus du <meta name="robots"> dans le HTML et de
# robots.txt) — s'applique aussi aux réponses non-HTML.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

    # ── En-tetes de securite (audit de pre-lancement, 10/09/2026) ──────────────
    #
    # L'OS etait la seule des quatre surfaces a n'envoyer que HSTS : ni CSP, ni protection
    # contre l'inclusion en iframe, ni Referrer-Policy. C'est pourtant celle qui manipule
    # toutes les donnees internes, et celle ou trois injections en attribut ont ete fermees
    # la veille — une CSP y a d'autant plus de valeur qu'elle limite ce qu'une injection
    # residuelle pourrait faire.
    #
    # `unsafe-inline` est inevitable ici et assume : l'OS est un fichier unique de 3,5 Mo dont
    # tout le script et tout le style sont en ligne. Le retirer demanderait de decouper le
    # fichier, ce qui est exactement le refactor que cet audit s'interdit.
    #
    # Les sources autorisees sont celles que l'OS utilise reellement, relevees dans la page
    # servie : Supabase (donnees et temps reel), jsDelivr (bibliotheques), l'API de QR codes,
    # et les images en data: (avatars du staff, logos).
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://lulgezzpvrlbftbykzrc.supabase.co https://api.qrserver.com; connect-src 'self' https://lulgezzpvrlbftbykzrc.supabase.co wss://lulgezzpvrlbftbykzrc.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"

[[redirects]]
  from = "/demo"
  to = "/SportVision-OS-Full.html"
  status = 200

[[redirects]]
  from = "/demo/*"
  to = "/SportVision-OS-Full.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/SportVision-OS-Full.html"
  status = 200
