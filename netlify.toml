[build]
  publish = "livrables/SportVision-TV"
  # Économie de crédits (02/09/2026) : même filtre que les 2 sites Club+/Connect (voir leurs
  # netlify.toml respectifs pour le détail) — sans lui, ce site relançait aussi un déploiement à
  # chaque push sur main, y compris quand aucun fichier de ce dossier n'avait changé.
  ignore = "git diff --quiet ${CACHED_COMMIT_REF:-HEAD^} HEAD -- livrables/SportVision-TV"

# Domaine privé, non annoncé (bc6m3cgdz.sportvision-an.fr) — voir netlify/edge-functions/
# block-default-domain.js pour le blocage de sportvision-os.netlify.app.
[[edge_functions]]
  path = "/*"
  function = "block-default-domain"

# Défense en profondeur contre l'indexation (en plus du <meta name="robots"> dans le HTML et de
# robots.txt) — s'applique aussi aux réponses non-HTML.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[redirects]]
  from = "/demo"
  to = "/SportVision-OS-Full.html"
  status = 200

[[redirects]]
  from = "/demo/*"
  to = "/SportVision-OS-Full.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/SportVision-OS-Full.html"
  status = 200
