[build]
  base = "livrables/SportVision-Connect/app-connect"
  command = "npm run build"
  # Même raison que app-next/netlify.toml : "publish" vide se résout sur le même chemin que
  # "base", ce que le plugin Next.js refuse. .next est la valeur attendue par le Next Runtime.
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Variables d'environnement à définir dans Netlify (Site settings → Environment variables),
# jamais ici :
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY

# Headers de sécurité navigateur — absents jusqu'ici (trouvé par l'audit pré-lancement du
# 21/08, seule la Vitrine les avait). Repris du même patron déjà validé sur
# livrables/SportVision/netlify.toml. font-src/style-src incluent fonts.googleapis.com/
# fonts.gstatic.com car layout.tsx charge Material Symbols via un <link> direct (pas next/font,
# qui lui sert les autres polices depuis le domaine propre — voir INC-011, la CSP a déjà cassé
# des Google Fonts par le passé sur un autre site de ce projet). Le paiement Stripe est une
# redirection pleine page (window.location.href), jamais un iframe/script embarqué — pas besoin
# d'autoriser de domaine Stripe ici.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://lulgezzpvrlbftbykzrc.supabase.co; connect-src 'self' https://lulgezzpvrlbftbykzrc.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'"
