[build]
  publish = "."

# Contrairement à Portail/Club+/Connect (redirection catch-all vers un seul
# fichier), la vitrine a de vraies pages distinctes : chaque .html doit être
# servi tel quel. Seules les URLs "propres" (sans .html) redirigent vers leur
# fichier, pour permettre /offres plutôt que /offres.html une fois le domaine
# définitif branché.

[[redirects]]
  from = "/offres"
  to = "/prestations.html"
  status = 301

[[redirects]]
  from = "/demande-de-devis"
  to = "/demande-de-devis.html"
  status = 200

[[redirects]]
  from = "/a-propos"
  to = "/a-propos.html"
  status = 200

[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales.html"
  status = 200

[[redirects]]
  from = "/cgv"
  to = "/cgv.html"
  status = 200

[[redirects]]
  from = "/confidentialite"
  to = "/confidentialite.html"
  status = 200

# Architecture commerciale séparée (2026-08-06) : prestations ponctuelles,
# Club+, Full Communication et accompagnements par profil ont chacun leur
# page dédiée au lieu d'une seule page "offres" mélangée.

[[redirects]]
  from = "/prestations"
  to = "/prestations.html"
  status = 200

[[redirects]]
  from = "/club-plus"
  to = "/club-plus.html"
  status = 200

[[redirects]]
  from = "/full-communication"
  to = "/full-communication.html"
  status = 200

[[redirects]]
  from = "/connect"
  to = "/connect.html"
  status = 200

[[redirects]]
  from = "/accompagnements"
  to = "/accompagnements.html"
  status = 200

[[redirects]]
  from = "/accompagnements/academies"
  to = "/accompagnements-academies.html"
  status = 200

[[redirects]]
  from = "/accompagnements/coachs"
  to = "/accompagnements-coachs.html"
  status = 200

[[redirects]]
  from = "/accompagnements/joueurs"
  to = "/accompagnements-joueurs.html"
  status = 200

[[redirects]]
  from = "/accompagnements/evenements"
  to = "/accompagnements-evenements.html"
  status = 200
