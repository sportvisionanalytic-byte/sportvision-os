[build]
  base = "livrables/SportVision-Connect/app-connect"
  command = "npm run build"
  # Même raison que app-next/netlify.toml : "publish" vide se résout sur le même chemin que
  # "base", ce que le plugin Next.js refuse. .next est la valeur attendue par le Next Runtime.
  publish = ".next"
  # Filtre `ignore` RETIRÉ le 07/09/2026, deuxième incident du même filtre. Il a annulé le
  # déploiement de la galerie publique ("Canceled build due to no content change") alors que le
  # commit ajoutait six fichiers dans ce dossier même. Exactement ce qui était arrivé à app-next
  # le 05/09, où il avait bloqué TOUS les déploiements pendant plus de 24 h sans que personne ne
  # le voie : Fouka avait testé en production un site vieux d'une journée.
  #
  # La cause exacte reste non identifiée (les logs Netlify ne détaillent pas la commande `ignore`),
  # mais l'effet est sans ambiguïté et s'est reproduit. Le risque qu'un vrai changement ne se
  # déploie jamais silencieusement l'emporte largement sur le coût de quelques builds inutiles.
  # À ne réintroduire qu'avec un filtre dont le comportement est vérifié fiable dans la durée.

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Variables d'environnement à définir dans Netlify (Site settings → Environment variables),
# jamais ici :
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY

# Headers de sécurité navigateur : définis dans next.config.js (`headers()`), pas ici — vérifié
# en direct (audit pré-lancement du 21/08) qu'un bloc [[headers]] dans ce fichier n'atteint pas
# les routes rendues par le Next Runtime (@netlify/plugin-nextjs), contrairement à un site
# statique classique comme la Vitrine.
