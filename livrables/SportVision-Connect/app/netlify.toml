[build]
  publish = "."

# Connect est une app multi-fichiers (index.html + modules/*.js), contrairement
# au Portail qui est un fichier HTML unique. Les fichiers réels (modules/*.js,
# manifest.json, sw.js, icônes) sont servis tels quels par Netlify ; seule une
# route qui ne correspond à aucun fichier existant retombe sur index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Le service worker ne doit jamais être servi depuis un cache intermédiaire :
# sinon une mise à jour de l'app pourrait ne jamais atteindre les utilisateurs.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
