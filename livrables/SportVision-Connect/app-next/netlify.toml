[build]
  base = "livrables/SportVision-Connect/app-next"
  command = "npm run build"
  # Économie de crédits (02/09/2026) : sans ce filtre, ce site relance un build complet à CHAQUE
  # push sur main, même quand rien n'a changé dans ce dossier (ex. une migration SQL seule, ou un
  # correctif de l'OS) — vérifié en direct via l'API Netlify, les 3 sites du repo se relançaient
  # avec le même horodatage à chaque push, sans filtre par dossier. `git diff --quiet` sort en 0
  # (= "silencieux", aucune différence) quand ce dossier n'a pas bougé, ce que Netlify interprète
  # comme "ignorer ce build" ; il sort en 1 dès qu'il y a une vraie différence, ce qui déclenche le
  # build normalement. $CACHED_COMMIT_REF (fourni par Netlify = dernier commit réellement
  # déployé sur CE site, pas juste le parent immédiat) plutôt que HEAD^ : sinon, pousser plusieurs
  # commits d'un coup (plusieurs correctifs groupés en un seul push, exactement pour économiser
  # des crédits) ne comparerait que les 2 derniers commits du lot et raterait les changements plus
  # anciens du même push. Repli sur HEAD^ uniquement si la variable n'existe pas encore (site tout
  # juste connecté, aucun déploiement précédent en cache).
  ignore = "git diff --quiet ${CACHED_COMMIT_REF:-HEAD^} HEAD -- livrables/SportVision-Connect/app-next"
  # "publish" vide se résout par défaut sur le même chemin que "base" (publishOrigin: default,
  # vu dans les logs de build du 09/08/2026), ce que le plugin Next.js refuse explicitement
  # ("Your publish directory cannot be the same as the base directory"). .next (sortie standard
  # de `next build`, sous-dossier de base) est la valeur attendue par le Next Runtime — ce n'est
  # pas ce qu'il sert réellement (il gère SSR/Server Components/Middleware lui-même), juste ce
  # qu'il faut déclarer pour satisfaire cette vérification.
  publish = ".next"

# Plugin déclaré explicitement : la détection automatique du Next Runtime par Netlify a échoué
# une première fois (site créé le 09/08/2026 avec "Runtime: Not set" dans Build settings — tout
# renvoyait 404, y compris /favicon.ico, signe qu'aucun adaptateur SSR n'était branché). Le
# déclarer ici force son activation quelle que soit la détection automatique.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Variables d'environnement à définir dans Netlify (Site settings → Environment variables),
# jamais ici :
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY

# Headers de sécurité navigateur : définis dans next.config.mjs (`headers()`), pas ici — vérifié
# en direct (audit pré-lancement du 21/08) qu'un bloc [[headers]] dans ce fichier n'atteint pas
# les routes rendues par le Next Runtime (@netlify/plugin-nextjs), contrairement à un site
# statique classique comme la Vitrine.
